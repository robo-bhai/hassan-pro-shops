name: Database Backup to Google Drive (Latest 7 Rotated)

on:
  workflow_dispatch: # Manual trigger enabled

jobs:
  backup-to-gdrive:
    runs-on: ubuntu-latest

    # GitHub Runner local MySQL container service for ultra-low latency execution
    services:
      local-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: local_django_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pymysql sqlalchemy python-dotenv jq

    - name: Run Encrypted Backup (Local & Cloud Sequential)
      env:
        # Cloud Database Credentials
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_NAME: ${{ secrets.DB_NAME }}
        # Local Database Credentials (Maps to Runner MySQL service)
        LOCAL_DB_USER: "root"
        LOCAL_DB_PASS: "root"
        LOCAL_DB_HOST: "127.0.0.1"
        LOCAL_DB_PORT: "3306"
        LOCAL_DB_NAME: "local_django_db"
        BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
      run: |
        echo "🔒 Starting Database Backup (Local -> Cloud Sequence)..."
        python db_backup_manager.py backup
        
        # Verify file creation
        if [ -z "$(ls -A *.enc 2>/dev/null)" ]; then
          echo "❌ Backup file not generated!"
          exit 1
        fi
        echo "✅ Encrypted backup file(s) generated successfully."

    - name: Install & Setup Rclone
      env:
        RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
      run: |
        sudo apt-get update && sudo apt-get install -y rclone jq
        mkdir -p ~/.config/rclone
        
        # Write config via environment variable safely
        echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
        
        # Verify Rclone configuration
        echo "📋 Available Rclone Remotes:"
        rclone listremotes

    - name: Upload New Backup & Rotate (Keep Latest 7)
      run: |
        TARGET_DIR="gdrive:DB_Backups"

        echo "🚀 Uploading new backup files to Google Drive folder: DB_Backups..."
        # Sync current directory files matching *.enc
        rclone copy . "$TARGET_DIR" --include "*.enc" --verbose

        echo "🧹 Checking and rotating backups (Keeping only latest 7)..."
        
        # Fetch sorted list of encrypted backup files by modification time
        ALL_FILES=$(rclone lsjson "$TARGET_DIR" --include "*.enc" | jq -r 'sort_by(.ModTime) | .[].Name' | grep -v '^$' || true)
        
        if [ -z "$ALL_FILES" ]; then
          FILE_COUNT=0
        else
          FILE_COUNT=$(echo "$ALL_FILES" | wc -l)
        fi

        echo "📊 Total backups currently in Drive: $FILE_COUNT"

        # Prune oldest backups if exceeding 7 files
        if [ "$FILE_COUNT" -gt 7 ]; then
          DELETE_COUNT=$((FILE_COUNT - 7))
          echo "⚠️ Found $FILE_COUNT backups. Deleting oldest $DELETE_COUNT backup(s)..."
          
          FILES_TO_DELETE=$(echo "$ALL_FILES" | head -n $DELETE_COUNT)
          
          for FILE in $FILES_TO_DELETE; do
            echo "🗑️ Deleting old backup: $FILE"
            rclone deletefile "$TARGET_DIR/$FILE"
          done
          echo "✅ Old backups cleaned up successfully."
        else
          echo "ℹ️ Total backups ($FILE_COUNT) are within the 7-file limit. No cleanup needed."
        fi

    - name: Workflow Status Summary
      run: |
        echo "🎉 Local & Cloud Backup and 7-file rotation process completed successfully!"
