name: Django CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      restore_action:
        description: 'Type "r" or "latest" or specific file name within 10s to force restore. Default runs standard pipeline.'
        required: false
        default: ''

concurrency:
  group: django-production-runner
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      local-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: local_django_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_PORT: ${{ secrets.DB_PORT }}
      BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      SUPERUSER_NAME: ${{ secrets.SUPERUSER_NAME }}
      SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pips & Tools
        run: |
          python -m pip install --upgrade pip
          pip install pymysql gunicorn "django-import-export>=3.3.0" "django>=5.2,<5.3" django-dbbackup django-axes reportlab openpyxl pillow python-barcode qrcode cryptography sqlalchemy python-dotenv requests django-pwa whitenoise
          sudo apt-get update
          sudo apt-get install -y mysql-client rclone

      # --- 10-SECOND RESTORE PROMPT & INTERACTION ---
      - name: Check Restore Input with 10s Delay
        id: restore-check
        env:
          INPUT_VAL: ${{ github.event.inputs.restore_action }}
        run: |
          echo "=================================================="
          echo "         RESTORE INPUT CHECK (10s TIMEOUT)        "
          echo "=================================================="
          echo "Provided Input: '$INPUT_VAL'"
          
          # Wait 10 seconds timeout buffer
          sleep 10
          
          if [ -n "$INPUT_VAL" ]; then
            echo "RESTORE_REQUESTED=true" >> $GITHUB_ENV
            echo "TARGET_RESTORE_FILE=$INPUT_VAL" >> $GITHUB_ENV
            echo "Restore Signal Detected! Overriding standard pipeline..."
          else
            echo "RESTORE_REQUESTED=false" >> $GITHUB_ENV
            echo "No restore input received within 10s. Proceeding with standard run..."
          fi

      # --- CONDITIONAL DATABASE FORCED RESTORE ROUTE FROM GDRIVE ---
      - name: Force Restore Database from Google Drive Snapshot
        if: env.RESTORE_REQUESTED == 'true'
        run: |
          echo "=== EXECUTING FORCED RESTORE FROM GOOGLE DRIVE ==="
          
          # 1. Fetch file list from Google Drive via rclone
          if [ "$TARGET_RESTORE_FILE" = "r" ] || [ "$TARGET_RESTORE_FILE" = "latest" ]; then
            echo "Locating latest backup snapshot from Google Drive..."
            RESTORE_FILE=$(rclone lsf gdrive: | grep "^db_snapshot_" | sort | tail -n 1)
          else
            RESTORE_FILE="$TARGET_RESTORE_FILE"
          fi

          echo "Selected Backup File: $RESTORE_FILE"
          
          # 2. Download Encrypted Snapshot
          rclone copy "gdrive:$RESTORE_FILE" ./
          
          # 3. Decrypt snapshot using BACKUP_SECRET_KEY secret
          python -c "
          import os, base64
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          secret = os.environ['BACKUP_SECRET_KEY'].encode()
          salt = b'django_backup_salt_2026'
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=100000)
          key = base64.urlsafe_b64encode(kdf.derive(secret))
          fernet = Fernet(key)

          with open('$RESTORE_FILE', 'rb') as f:
              encrypted_data = f.read()

          decrypted_data = fernet.decrypt(encrypted_data)

          with open('restored_snapshot.sql.gz', 'wb') as f:
              f.write(decrypted_data)
          print('Snapshot Decryption Successful!')
          "

          # 4. Wipe Cloud & Local Tables and Apply Restored Backup
          gunzip -c restored_snapshot.sql.gz > restored_snapshot.sql
          
          echo "Wiping and applying data to Cloud DB..."
          MYSQL_PWD="$DB_PASS" mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED -e "DROP DATABASE IF EXISTS \`$DB_NAME\`; CREATE DATABASE \`$DB_NAME\`;"
          MYSQL_PWD="$DB_PASS" mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" < restored_snapshot.sql
          
          echo "Wiping and applying data to Local DB..."
          MYSQL_PWD="root" mysql -h 127.0.0.1 -P 3306 -u root -e "DROP DATABASE IF EXISTS local_django_db; CREATE DATABASE local_django_db;"
          MYSQL_PWD="root" mysql -h 127.0.0.1 -P 3306 -u root local_django_db < restored_snapshot.sql

          echo "Forced Database Restoration Completed Successfully!"

      # --- STEP 1: RESTORE CACHE FILES FROM GITHUB CACHE ---
      - name: Restore Local DB Cache
        if: env.RESTORE_REQUESTED != 'true'
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cloud_data_dump.sql.gz
            cache_time.txt
          key: mysql-db-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mysql-db-cache-${{ runner.os }}-

      # --- STEP 2: APPLY MIGRATIONS & CREATE SUPERUSER ON CLOUD DB FIRST ---
      - name: Apply Migrations & Create Superuser on Cloud Aiven MySQL
        if: env.RESTORE_REQUESTED != 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          echo "=== 1. DIAGNOSING CLOUD MYSQL CONNECTION ==="
          python -c "
          import time, pymysql, os
          start = time.time()
          try:
              conn = pymysql.connect(
                  host=os.environ['DB_HOST'],
                  user=os.environ['DB_USER'],
                  password=os.environ['DB_PASS'],
                  database=os.environ['DB_NAME'],
                  port=int(os.environ['DB_PORT']),
                  ssl={'ssl-mode': 'REQUIRED'}
              )
              cursor = conn.cursor()
              cursor.execute('SELECT VERSION();')
              db_version = cursor.fetchone()
              print(f'SUCCESS: Connected to Cloud MySQL in {round((time.time() - start)*1000, 2)} ms. Version: {db_version[0]}')
              conn.close()
          except Exception as e:
              print(f'ERROR: Cloud database connection failed: {e}')
              exit(1)
          "

          echo "=== 2. GENERATING MIGRATIONS ==="
          python manage.py makemigrations

          echo "=== 3. APPLYING MIGRATIONS DIRECTLY TO CLOUD MYSQL ==="
          python manage.py migrate

          echo "=== 4. ENSURING SUPERUSER CREATION ON CLOUD MYSQL ==="
          python manage.py shell -c "
          import os
          from django.contrib.auth import get_user_model
          User = get_user_model()
          username = os.environ.get('SUPERUSER_NAME')
          email = os.environ.get('SUPERUSER_EMAIL')
          password = os.environ.get('SUPERUSER_PASSWORD')
          if username and password:
              user, created = User.objects.get_or_create(username=username, defaults={'email': email})
              user.set_password(password)
              user.is_staff = True
              user.is_superuser = True
              user.save()
              print(f'CLOUD DB: Superuser \'{username}\' verified and saved successfully.')
          else:
              print('CLOUD DB: Skipping superuser creation (Credentials not set in secrets).')
          "

      # --- STEP 3: SMART CACHE VALIDATION & SAFE DATA RESTORE ---
      - name: Smart Cache Validation & Safe Database Restore
        if: env.RESTORE_REQUESTED != 'true'
        run: |
          echo "=== CHECKING CACHE AGE & VALIDITY ==="
          python -c "
          import os, time

          CACHE_FILE = 'cloud_data_dump.sql.gz'
          TIME_FILE = 'cache_time.txt'
          MAX_AGE = 15 * 60  # 15 minutes

          use_cache = False

          if os.path.exists(CACHE_FILE) and os.path.exists(TIME_FILE):
              try:
                  with open(TIME_FILE, 'r') as f:
                      cached_timestamp = float(f.read().strip())
                  
                  age = time.time() - cached_timestamp
                  
                  if age <= MAX_AGE and os.path.getsize(CACHE_FILE) > 10240:
                      print(f'VALID CACHE: Cache age is {round(age/60, 2)} mins (Under 15 mins).')
                      use_cache = True
                  else:
                      print(f'EXPIRED CACHE: Cache age is {round(age/60, 2)} mins (Exceeds 15 mins).')
              except Exception as e:
                  print(f'Cache validation error: {e}')

          with open('cache_decision.txt', 'w') as f:
              f.write('USE_CACHE' if use_cache else 'DOWNLOAD_FRESH')
          "

          DECISION=$(cat cache_decision.txt)

          if [ "$DECISION" = "USE_CACHE" ]; then
            echo "=== SAFE RESTORE: Loading Valid Cache into Local MySQL ==="
            gunzip -c cloud_data_dump.sql.gz > cloud_data_dump.sql
            MYSQL_PWD="root" mysql -h 127.0.0.1 -P 3306 -u root local_django_db < cloud_data_dump.sql
            echo "Safe Cache Restoration Completed."
          else
            echo "=== DOWNLOADING FRESH SAFE DUMP FROM CLOUD MYSQL ==="
            MYSQL_PWD="$DB_PASS" mysqldump -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
              --ssl-mode=REQUIRED \
              --set-gtid-purged=OFF \
              --column-statistics=0 \
              --single-transaction \
              --replace \
              --quick "$DB_NAME" > cloud_fresh_dump.sql

            MYSQL_PWD="root" mysql -h 127.0.0.1 -P 3306 -u root local_django_db < cloud_fresh_dump.sql
            rm -f cloud_fresh_dump.sql
            echo "Fresh Safe Cloud Data Applied to Local MySQL Successfully."
          fi

      # --- STEP 4: APPLY MIGRATIONS & CREATE SUPERUSER ON LOCAL DB ---
      - name: Sync Migrations & Ensure Superuser on Local DB
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASS: "root"
          DB_NAME: "local_django_db"
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          echo "=== 1. APPLYING MIGRATIONS TO LOCAL DB ==="
          python manage.py migrate

          echo "=== 2. ENSURING SUPERUSER CREATION ON LOCAL DB ==="
          python manage.py shell -c "
          import os
          from django.contrib.auth import get_user_model
          User = get_user_model()
          username = os.environ.get('SUPERUSER_NAME')
          email = os.environ.get('SUPERUSER_EMAIL')
          password = os.environ.get('SUPERUSER_PASSWORD')
          if username and password:
              user, created = User.objects.get_or_create(username=username, defaults={'email': email})
              user.set_password(password)
              user.is_staff = True
              user.is_superuser = True
              user.save()
              print(f'LOCAL DB: Superuser \'{username}\' verified and saved successfully.')
          else:
              print('LOCAL DB: Skipping superuser creation (Credentials not set in secrets).')
          "

      - name: Process & Place PWA Icons from Project Root
        run: |
          python -c "
          import os
          from PIL import Image

          project_dir = os.getcwd()
          target_dir = os.path.join(project_dir, 'ceo_module', 'static', 'ceo', 'images')
          os.makedirs(target_dir, exist_ok=True)

          extensions = ('.png', '.jpg', '.jpeg', '.webp')
          found_images = [
              os.path.join(project_dir, f) for f in os.listdir(project_dir)
              if f.lower().endswith(extensions)
          ]

          if not found_images:
              print('No source image found in Project Root directory to resize.')
          else:
              source_img_path = found_images[0]
              print(f'Processing source image: {source_img_path}')

              sizes = [(192, 192, 'icon-192.png'), (512, 512, 'icon-512.png')]

              with Image.open(source_img_path) as img:
                  img = img.convert('RGBA')
                  for width, height, filename in sizes:
                      resized_img = img.resize((width, height), Image.Resampling.LANCZOS)
                      output_path = os.path.join(target_dir, filename)
                      resized_img.save(output_path, 'PNG')
                      print(f'Saved: {output_path}')
          "

      - name: Collect Static Files
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASS: "root"
          DB_NAME: "local_django_db"
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          mkdir -p static
          python manage.py collectstatic --noinput

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Check and Kill Existing Local Processes
        run: |
          echo "Cleaning up any old Django or Cloudflared instances on the runner..."
          pkill -f "manage.py runserver" || true
          pkill -f "cloudflared" || true
          sleep 2

      - name: Start Django Server & Permanent Cloudflare Tunnel
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASS: "root"
          DB_NAME: "local_django_db"
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          touch django.log tunnel.log

          PYTHONUNBUFFERED=1 python -u manage.py runserver 0.0.0.0:8000 > django.log 2>&1 &
          cloudflared tunnel run --token ${{ secrets.CLOUDFLARE_TOKEN }} > tunnel.log 2>&1 &
          
          sleep 6
          echo "=== SERVER & CLOUDFLARE TUNNEL LIVE ==="

      - name: Get Public IP & Send Notification to ntfy
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me || curl -s api.ipify.org)
          echo "GitHub Runner Public IP: $PUBLIC_IP"
          
          MESSAGE="Django App Live! 🚀 (Superuser Verified on Cloud & Local DBs)
          Domain: https://shops.hadi88.online
          Direct IP: http://$PUBLIC_IP:8000"
          
          curl -d "$MESSAGE" ntfy.sh/hshshehgag

      - name: Realtime HTTP Access Logs & Error Stream
        run: |
          echo "=========================================="
          echo " LIVE HTTP SERVER ACCESS LOGS & ERRORS "
          echo "=========================================="
          
          for i in {1..36}; do
            sleep 300
            echo "------------------------------------------"
            echo "TIMESTAMP: $(date)"
            echo "--- SERVER HTTP ACCESS LOGS (Path - Status) ---"
            grep -E '"GET|POST|PUT|DELETE|HEAD' django.log || echo "No HTTP requests logged yet."
            echo "--- RECENT EXCEPTIONS / ERROR TRACEBACKS ---"
            grep -i -C 3 "error\|exception\|traceback\|500\|404" django.log || echo "No errors detected."
            echo "------------------------------------------"
          done

      # --- STEP 5: SAFE CACHE CREATION & SYNC BACK TO CLOUD ---
      - name: Sync Local Runner MySQL Back to Cloud Aiven MySQL
        if: always()
        run: |
          echo "=========================================="
          echo " 1. CREATING SAFE CACHE DUMP FOR FUTURE RUNS "
          echo "=========================================="
          MYSQL_PWD="root" mysqldump -h 127.0.0.1 -P 3306 -u root \
            --set-gtid-purged=OFF \
            --column-statistics=0 \
            --single-transaction \
            --replace local_django_db | gzip > cloud_data_dump.sql.gz

          python -c "
          import time
          with open('cache_time.txt', 'w') as f:
              f.write(str(time.time()))
          "

          echo "=========================================="
          echo " 2. PUSHING UPDATED LOCAL DATA TO CLOUD MYSQL SAFELY "
          echo "=========================================="
          MYSQL_PWD="root" mysqldump -h 127.0.0.1 -P 3306 -u root \
            --set-gtid-purged=OFF \
            --column-statistics=0 \
            --no-create-info \
            --replace local_django_db > runner_updated_data.sql

          gzip -f runner_updated_data.sql

          gunzip -c runner_updated_data.sql.gz | MYSQL_PWD="$DB_PASS" mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME"
          
          echo "Sync Up Back to Cloud Completed Successfully!"

      # --- STEP 6: ENCRYPTED SNAPSHOT CREATION & RCLONE UPLOAD TO GDRIVE ---
      - name: Create Encrypted Database Snapshot & Upload via Rclone
        if: always()
        env:
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          echo "=========================================="
          echo " CREATING ENCRYPTED SNAPSHOT FOR GOOGLE DRIVE "
          echo "=========================================="

          # 1. Format Naming DD-MM-YY_HH-MM
          TIMESTAMP=$(date +"%d-%m-%y_%H-%M")
          SNAPSHOT_FILENAME="db_snapshot_${TIMESTAMP}.sql.gz.enc"

          # 2. Complete DB Dump & Gzip Compression
          MYSQL_PWD="root" mysqldump -h 127.0.0.1 -P 3306 -u root \
            --set-gtid-purged=OFF \
            --column-statistics=0 \
            --single-transaction \
            local_django_db | gzip > raw_snapshot.sql.gz

          # 3. Encrypt file using Python Fernet and BACKUP_SECRET_KEY secret
          python -c "
          import os, base64
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          secret = os.environ['BACKUP_SECRET_KEY'].encode()
          salt = b'django_backup_salt_2026'
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=100000)
          key = base64.urlsafe_b64encode(kdf.derive(secret))
          fernet = Fernet(key)

          with open('raw_snapshot.sql.gz', 'rb') as f:
              data = f.read()

          encrypted = fernet.encrypt(data)

          with open('$SNAPSHOT_FILENAME', 'wb') as f:
              f.write(encrypted)
          print('Snapshot encrypted successfully as $SNAPSHOT_FILENAME')
          "

          # 4. Upload Encrypted File to Google Drive
          rclone copy "$SNAPSHOT_FILENAME" gdrive:
          echo "Successfully uploaded $SNAPSHOT_FILENAME to Google Drive!"

      - name: Save Updated DB Dump & Timestamp to GitHub Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cloud_data_dump.sql.gz
            cache_time.txt
          key: mysql-db-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Full Dump of Logs On Workflow Stop or Error
        if: always()
        run: |
          echo "=========================================="
          echo "       COMPLETE DJANGO SERVER LOGS        "
          echo "=========================================="
          cat django.log || echo "django.log is empty."
          echo "=========================================="
          echo "       COMPLETE CLOUDFLARE TUNNEL LOGS    "
          echo "=========================================="
          cat tunnel.log || echo "tunnel.log is empty."
