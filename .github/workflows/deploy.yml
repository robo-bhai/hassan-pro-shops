name: Django CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: django-production-runner
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # GitHub Runner local MySQL container service for ultra-low latency execution
    services:
      local-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: local_django_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_PORT: ${{ secrets.DB_PORT }}
      BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      SUPERUSER_NAME: ${{ secrets.SUPERUSER_NAME }}
      SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pips
        run: |
          python -m pip install --upgrade pip
          pip install pymysql gunicorn "django-import-export>=3.3.0" "django>=5.2,<5.3" django-dbbackup django-axes reportlab openpyxl pillow python-barcode qrcode cryptography sqlalchemy python-dotenv requests django-pwa whitenoise

      - name: Install MySQL Client CLI Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      # --- STEP 1: RESTORE MYSQL DUMP FROM GITHUB CACHE ---
      - name: Restore Local DB Cache
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: cloud_data_dump.sql.gz
          key: mysql-db-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mysql-db-cache-${{ runner.os }}-

      # --- STEP 2: SMART SYNC DOWN (CLOUD -> LOCAL) ---
      - name: Smart Sync Down Cloud DB to Local MySQL
        run: |
          echo "=== 1. DIAGNOSING CLOUD AIVEN MYSQL CONNECTION ==="
          python -c "
          import time, pymysql, os
          start = time.time()
          try:
              conn = pymysql.connect(
                  host=os.environ['DB_HOST'],
                  user=os.environ['DB_USER'],
                  password=os.environ['DB_PASS'],
                  database=os.environ['DB_NAME'],
                  port=int(os.environ['DB_PORT']),
                  ssl={'ssl-mode': 'REQUIRED'}
              )
              cursor = conn.cursor()
              cursor.execute('SELECT VERSION();')
              db_version = cursor.fetchone()
              end = time.time()
              ms = round((end - start)*1000, 2)
              print(f'SUCCESS: Connected to Aiven MySQL in {ms} ms. Version: {db_version[0]}')
              conn.close()
          except Exception as e:
              print(f'ERROR: Cloud database connection failed: {e}')
              exit(1)
          "

          if [ -f cloud_data_dump.sql.gz ] && [ $(stat -c%s "cloud_data_dump.sql.gz") -gt 10240 ]; then
            echo "=== CACHE HIT: Restoring Valid DB Dump from GitHub Cache (1-2 Seconds) ==="
            gunzip -c cloud_data_dump.sql.gz > cloud_data_dump.sql
            MYSQL_PWD="root" mysql -h 127.0.0.1 -P 3306 -u root local_django_db < cloud_data_dump.sql
            echo "Sync Down from Cache Completed Successfully."
          else
            echo "=== CACHE MISS / INVALID CACHE: Downloading Full Dump from Aiven Cloud MySQL ==="
            MYSQL_PWD="$DB_PASS" mysqldump -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
              --ssl-mode=REQUIRED \
              --set-gtid-purged=OFF \
              --column-statistics=0 \
              --single-transaction \
              --quick "$DB_NAME" > cloud_data_dump.sql

            MYSQL_PWD="root" mysql -h 127.0.0.1 -P 3306 -u root local_django_db < cloud_data_dump.sql
            gzip -c cloud_data_dump.sql > cloud_data_dump.sql.gz
            echo "Sync Down from Cloud Completed Successfully."
          fi

      - name: Make Migrations & Apply to Local Runner Database
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASS: "root"
          DB_NAME: "local_django_db"
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          echo "=== 1. GENERATING MIGRATIONS ==="
          python manage.py makemigrations

          echo "=== 2. APPLYING MIGRATIONS TO LOCAL DB ==="
          python manage.py migrate

      - name: Create Default Superuser
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASS: "root"
          DB_NAME: "local_django_db"
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          python manage.py shell -c "
          import os
          from django.contrib.auth.models import User
          username = os.environ.get('SUPERUSER_NAME')
          email = os.environ.get('SUPERUSER_EMAIL')
          password = os.environ.get('SUPERUSER_PASSWORD')
          if username and password:
              if not User.objects.filter(username=username).exists():
                  User.objects.create_superuser(username, email, password)
                  print('Superuser created successfully.')
              else:
                  print('Superuser already exists.')
          else:
              print('Skipping superuser creation: Credentials not provided in secrets.')
          "

      - name: Process & Place PWA Icons from Project Root
        run: |
          python -c "
          import os
          from PIL import Image

          project_dir = os.getcwd()
          target_dir = os.path.join(project_dir, 'ceo_module', 'static', 'ceo', 'images')
          os.makedirs(target_dir, exist_ok=True)

          extensions = ('.png', '.jpg', '.jpeg', '.webp')
          found_images = [
              os.path.join(project_dir, f) for f in os.listdir(project_dir)
              if f.lower().endswith(extensions)
          ]

          if not found_images:
              print('No source image found in Project Root directory to resize.')
          else:
              source_img_path = found_images[0]
              print(f'Processing source image: {source_img_path}')

              sizes = [(192, 192, 'icon-192.png'), (512, 512, 'icon-512.png')]

              with Image.open(source_img_path) as img:
                  img = img.convert('RGBA')
                  for width, height, filename in sizes:
                      resized_img = img.resize((width, height), Image.Resampling.LANCZOS)
                      output_path = os.path.join(target_dir, filename)
                      resized_img.save(output_path, 'PNG')
                      print(f'Saved: {output_path}')
          "

      - name: Collect Static Files
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASS: "root"
          DB_NAME: "local_django_db"
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          mkdir -p static
          python manage.py collectstatic --noinput

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Check and Kill Existing Local Processes
        run: |
          echo "Cleaning up any old Django or Cloudflared instances on the runner..."
          pkill -f "manage.py runserver" || true
          pkill -f "cloudflared" || true
          sleep 2

      - name: Start Django Server & Permanent Cloudflare Tunnel
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASS: "root"
          DB_NAME: "local_django_db"
          BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
        run: |
          touch django.log tunnel.log

          PYTHONUNBUFFERED=1 python -u manage.py runserver 0.0.0.0:8000 > django.log 2>&1 &
          cloudflared tunnel run --token ${{ secrets.CLOUDFLARE_TOKEN }} > tunnel.log 2>&1 &
          
          sleep 6
          echo "=== SERVER & CLOUDFLARE TUNNEL LIVE ==="

      - name: Get Public IP & Send Notification to ntfy
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me || curl -s api.ipify.org)
          echo "GitHub Runner Public IP: $PUBLIC_IP"
          
          MESSAGE="Django App Live! 🚀 (Running with Fast Local Cache DB)
          Domain: https://shops.hadi88.online
          Direct IP: http://$PUBLIC_IP:8000"
          
          curl -d "$MESSAGE" ntfy.sh/hshshehgag

      - name: Realtime HTTP Access Logs & Error Stream
        run: |
          echo "=========================================="
          echo " LIVE HTTP SERVER ACCESS LOGS & ERRORS "
          echo "=========================================="
          
          for i in {1..36}; do
            sleep 300
            echo "------------------------------------------"
            echo "TIMESTAMP: $(date)"
            echo "--- SERVER HTTP ACCESS LOGS (Path - Status) ---"
            grep -E '"GET|POST|PUT|DELETE|HEAD' django.log || echo "No HTTP requests logged yet."
            echo "--- RECENT EXCEPTIONS / ERROR TRACEBACKS ---"
            grep -i -C 3 "error\|exception\|traceback\|500\|404" django.log || echo "No errors detected."
            echo "------------------------------------------"
          done

      # --- STEP 3: FAST COMPRESSED SYNC UP TO CLOUD MYSQL ---
      - name: Sync Local Runner MySQL Back to Cloud Aiven MySQL
        if: always()
        run: |
          echo "=========================================="
          echo " PUSHING UPDATED LOCAL DATA TO CLOUD MYSQL"
          echo "=========================================="
          
          MYSQL_PWD="root" mysqldump -h 127.0.0.1 -P 3306 -u root \
            --set-gtid-purged=OFF \
            --column-statistics=0 \
            --no-create-info \
            --replace local_django_db > runner_updated_data.sql

          gzip -f runner_updated_data.sql

          gunzip -c runner_updated_data.sql.gz | MYSQL_PWD="$DB_PASS" mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME"
          
          echo "Sync Up Back to Cloud Completed Successfully!"

      # --- STEP 4: SAVE UPDATED DUMP TO GITHUB CACHE ---
      - name: Prepare Cache Dump File
        if: always()
        run: |
          echo "Creating high-validity full database dump for cache..."
          MYSQL_PWD="root" mysqldump -h 127.0.0.1 -P 3306 -u root \
            --set-gtid-purged=OFF \
            --column-statistics=0 \
            --single-transaction local_django_db | gzip > cloud_data_dump.sql.gz

      - name: Save Updated DB Dump to Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cloud_data_dump.sql.gz
          key: mysql-db-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Full Dump of Logs On Workflow Stop or Error
        if: always()
        run: |
          echo "=========================================="
          echo "       COMPLETE DJANGO SERVER LOGS        "
          echo "=========================================="
          cat django.log || echo "django.log is empty."
          echo "=========================================="
          echo "       COMPLETE CLOUDFLARE TUNNEL LOGS    "
          echo "=========================================="
          cat tunnel.log || echo "tunnel.log is empty."
