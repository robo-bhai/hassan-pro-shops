name: Django CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      restore_action:
        description: 'Type "latest", "list" or a specific backup file name to restore from Drive (10s window).'
        required: false
        default: ''
  repository_dispatch:
    types: [ backup_now, restore_now, migrate_now ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # loop ~310 min + setup; always() steps still run on timeout/cancel

    services:
      local-mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: local_django_db
        ports:
          - 3306:3306
        options: "--health-cmd=\"mysqladmin ping\" --health-interval=10s --health-timeout=5s --health-retries=10"

    env:
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      DB_HOST: "127.0.0.1"
      DB_NAME: "local_django_db"
      DB_USER: "root"
      DB_PASS: "root"
      DB_PORT: "3306"
      BACKUP_SECRET_KEY: ${{ secrets.BACKUP_SECRET_KEY }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      SUPERUSER_NAME: ${{ secrets.SUPERUSER_NAME }}
      SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
      RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
      PYTHONUNBUFFERED: "1"
      RUNNING_IN_TERMUX: "false"
      # Safety flags (set during the run):
      #   DB_READY=true  -> DB was restored/initialised correctly, safe to snapshot
      #   DUMP_OK=true   -> latest snapshot was validated, safe to save to cache
      DB_READY: "false"
      DUMP_OK: "false"
      RESTORE_DONE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # setup-python's cache:'pip' needs a requirements.txt, so cache pip dir directly
      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py313-v1-${{ hashFiles('requirements.txt', '.github/workflows/*.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-py313-

      - name: Wait for Previous Workflow Runs to Complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          while true; do
            OLDER_RUNS=$(gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=20" --jq "[.workflow_runs[] | select(.id < $CURRENT_RUN_ID and (.status == \"in_progress\" or .status == \"queued\")) | .id]")
            TOTAL_PENDING=$(echo "$OLDER_RUNS" | jq 'length')
            if [ "${TOTAL_PENDING:-0}" -gt 0 ]; then
              echo "Older run(s) $OLDER_RUNS active. Waiting 10s..."
              sleep 10
            else
              echo "No older active runs. Proceeding."
              break
            fi
          done

      - name: Install Pips & System Tools (MySQL Client & Rclone)
        run: |
          python -m pip install --upgrade pip
          pip install pymysql gunicorn "django-import-export>=3.3.0" "django>=5.2,<5.3" django-dbbackup django-axes reportlab openpyxl pillow python-barcode qrcode cryptography sqlalchemy python-dotenv requests django-pwa whitenoise django-cloudinary-storage rembg numpy
          sudo apt-get update
          sudo apt-get install -y mysql-client rclone

      - name: Create Snapshot Helper Script
        run: |
          cat > "$HOME/snapshot.sh" <<'EOS'
          #!/bin/bash
          # Dumps FULL db (all tables, rows, routines, triggers, events) to a temp file,
          # validates it, and only then replaces local_data_dump.sql.gz.
          # A bad/empty dump can therefore never overwrite a good one.
          cd "$GITHUB_WORKSPACE" || exit 1
          TMP=local_data_dump.tmp.gz
          if [ "$DB_READY" != "true" ]; then
            echo "DB not ready/restored -> refusing to snapshot (protects old data)."
            echo "DUMP_OK=false" >> "$GITHUB_ENV"
            exit 1
          fi
          set -o pipefail
          if MYSQL_PWD=root mysqldump -h 127.0.0.1 -P 3306 -u root \
               --set-gtid-purged=OFF --column-statistics=0 --single-transaction \
               --routines --triggers --events --databases local_django_db | gzip > "$TMP" \
             && gzip -t "$TMP" \
             && [ "$(stat -c%s "$TMP")" -gt 5000 ]; then
            mv -f "$TMP" local_data_dump.sql.gz
            date +%s > cache_time.txt
            echo "Snapshot OK: $(stat -c%s local_data_dump.sql.gz) bytes"
            echo "DUMP_OK=true" >> "$GITHUB_ENV"
          else
            echo "Snapshot FAILED validation -> previous cache kept."
            rm -f "$TMP"
            echo "DUMP_OK=false" >> "$GITHUB_ENV"
            exit 1
          fi
          EOS
          chmod +x "$HOME/snapshot.sh"

      # --- ROUTE EVALUATION ---

      - name: Parse Trigger Source & Inputs
        id: trigger-router
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION_TYPE: ${{ github.event.action }}
          INPUT_VAL: ${{ github.event.inputs.restore_action }}
          CLIENT_PAYLOAD_FILE: ${{ github.event.client_payload.file }}
        run: |
          RESTORE_REQ="false"
          TARGET_FILE=""
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$ACTION_TYPE" = "restore_now" ]; then
              RESTORE_REQ="true"
              TARGET_FILE="${CLIENT_PAYLOAD_FILE:-latest}"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sleep 10
            if [ -n "$INPUT_VAL" ]; then
              RESTORE_REQ="true"
              TARGET_FILE="$INPUT_VAL"
            fi
          fi
          echo "RESTORE_REQUESTED=$RESTORE_REQ" >> $GITHUB_ENV
          echo "TARGET_RESTORE_FILE=$TARGET_FILE" >> $GITHUB_ENV

      # Manual restore from encrypted Google Drive snapshot (only when explicitly requested)
      - name: Restore Database from Google Drive Snapshot
        if: env.RESTORE_REQUESTED == 'true'
        run: |
          mkdir -p /home/runner/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > /home/runner/.config/rclone/rclone.conf
          REMOTE_NAME=$(rclone listremotes | head -n 1 | tr -d ':')
          TARGET_DIR="${REMOTE_NAME}:hassan_shops"

          if [ "$TARGET_RESTORE_FILE" = "list" ] || [ "$TARGET_RESTORE_FILE" = "ls" ]; then
            rclone lsl "$TARGET_DIR" --include "db_snapshot_*"
            exit 0   # list only: RESTORE_DONE stays false -> normal cache restore continues
          fi

          if [ "$TARGET_RESTORE_FILE" = "r" ] || [ "$TARGET_RESTORE_FILE" = "latest" ] || [ -z "$TARGET_RESTORE_FILE" ]; then
            RESTORE_FILE=$(rclone lsf "$TARGET_DIR" --format "pm" --files-only --include "db_snapshot_*" | sort -t';' -k2 | tail -n 1 | cut -d';' -f1)
          else
            RESTORE_FILE="$TARGET_RESTORE_FILE"
          fi
          [ -z "$RESTORE_FILE" ] && { echo "No snapshot found"; exit 1; }

          rclone copyto "${TARGET_DIR}/${RESTORE_FILE}" "./${RESTORE_FILE}"
          RESTORE_FILE="$RESTORE_FILE" python -c "
          import os, base64
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          secret = os.environ['BACKUP_SECRET_KEY'].encode()
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=b'django_backup_salt_2026', iterations=100000)
          fernet = Fernet(base64.urlsafe_b64encode(kdf.derive(secret)))
          data = fernet.decrypt(open(os.environ['RESTORE_FILE'], 'rb').read())
          open('restored_snapshot.sql.gz', 'wb').write(data)
          "
          gzip -t restored_snapshot.sql.gz
          gunzip -c restored_snapshot.sql.gz > restored_snapshot.sql
          MYSQL_PWD=root mysql -h 127.0.0.1 -P 3306 -u root -e "DROP DATABASE IF EXISTS local_django_db; CREATE DATABASE local_django_db;"
          MYSQL_PWD=root mysql -h 127.0.0.1 -P 3306 -u root local_django_db < restored_snapshot.sql
          echo "RESTORE_DONE=true" >> $GITHUB_ENV
          echo "DB_READY=true" >> $GITHUB_ENV

      # --- AUTOMATIC RESTORE OF LATEST DB (every normal start / rerun) ---

      - name: Restore Local DB Cache (latest snapshot)
        if: ${{ env.RESTORE_DONE != 'true' }}
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            local_data_dump.sql.gz
            cache_time.txt
          key: mysql-db-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mysql-db-cache-${{ runner.os }}-

      - name: Load Cached Snapshot Into MySQL (or fresh start)
        if: ${{ env.RESTORE_DONE != 'true' }}
        run: |
          if [ -f local_data_dump.sql.gz ] && gzip -t local_data_dump.sql.gz 2>/dev/null && [ "$(stat -c%s local_data_dump.sql.gz)" -gt 5000 ]; then
            echo "VALID CACHE FOUND ($(stat -c%s local_data_dump.sql.gz) bytes). Restoring..."
            gunzip -c local_data_dump.sql.gz | MYSQL_PWD=root mysql -h 127.0.0.1 -P 3306 -u root
            TABLES=$(MYSQL_PWD=root mysql -h 127.0.0.1 -P 3306 -u root -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='local_django_db';")
            echo "Tables restored: $TABLES"
            [ "$TABLES" -gt 3 ] || { echo "Restore produced too few tables - aborting to protect data"; exit 1; }
            echo "DB_READY=true" >> $GITHUB_ENV
          elif [ -f local_data_dump.sql.gz ]; then
            echo "Cache exists but is CORRUPT/too small. Aborting so it is not overwritten with an empty DB."
            echo "Use workflow_dispatch restore_action=latest to restore from Drive backup."
            exit 1
          else
            echo "NO CACHE FOUND: first run / cache evicted. Starting with a clean DB."
            echo "DB_READY=true" >> $GITHUB_ENV
          fi

      - name: Apply Migrations (non-destructive) & Ensure Superuser
        run: |
          python manage.py makemigrations --noinput
          # Plain migrate only applies NEW migrations. django_migrations table comes back
          # with the restored dump, so existing data is never touched. No --fake needed.
          python manage.py migrate --noinput

          python manage.py shell <<'PY'
          import os
          from django.contrib.auth import get_user_model
          User = get_user_model()
          username = os.environ.get('SUPERUSER_NAME')
          email = os.environ.get('SUPERUSER_EMAIL')
          password = os.environ.get('SUPERUSER_PASSWORD')
          if username and password:
              user, created = User.objects.get_or_create(username=username, defaults={'email': email})
              user.set_password(password)
              user.is_staff = True
              user.is_superuser = True
              user.save()
              print("Superuser verified:", username)
          PY

      - name: Notify Migration Done (migrate_now trigger)
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'migrate_now' }}
        run: curl -d "Django migrations & superuser verified on restored DB 🚀" ntfy.sh/hshshehgag

      - name: Process & Place PWA Icons from Project Root
        run: |
          python -c "
          import os
          from PIL import Image
          project_dir = os.getcwd()
          target_dir = os.path.join(project_dir, 'ceo_module', 'static', 'ceo', 'images')
          os.makedirs(target_dir, exist_ok=True)
          extensions = ('.png', '.jpg', '.jpeg', '.webp')
          found_images = [os.path.join(project_dir, f) for f in os.listdir(project_dir) if f.lower().endswith(extensions)]
          if found_images:
              sizes = [(192, 192, 'icon-192.png'), (512, 512, 'icon-512.png')]
              with Image.open(found_images[0]) as img:
                  img = img.convert('RGBA')
                  for w, h, name in sizes:
                      img.resize((w, h), Image.Resampling.LANCZOS).save(os.path.join(target_dir, name), 'PNG')
          "

      - name: Collect Static Files
        run: |
          mkdir -p static
          python manage.py collectstatic --noinput --clear

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Check and Kill Existing Local Processes
        run: |
          pkill -f "manage.py runserver" || true
          pkill -f "cloudflared" || true
          sleep 2

      - name: Create Encrypted Database Snapshot & Upload via Rclone
        if: ${{ github.event.action == 'backup_now' }}
        run: |
          mkdir -p /home/runner/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > /home/runner/.config/rclone/rclone.conf
          RCLONE_REMOTE=$(rclone listremotes | head -n 1)
          TIMESTAMP=$(date +"%d-%m-%y_%H-%M")
          export SNAPSHOT_FILENAME="db_snapshot_${TIMESTAMP}.sql.gz.enc"
          set -o pipefail
          MYSQL_PWD=root mysqldump -h 127.0.0.1 -P 3306 -u root --set-gtid-purged=OFF --column-statistics=0 --single-transaction --routines --triggers --events --databases local_django_db | gzip > raw_snapshot.sql.gz
          gzip -t raw_snapshot.sql.gz
          python -c "
          import os, base64
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          secret = os.environ['BACKUP_SECRET_KEY'].encode()
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=b'django_backup_salt_2026', iterations=100000)
          fernet = Fernet(base64.urlsafe_b64encode(kdf.derive(secret)))
          enc = fernet.encrypt(open('raw_snapshot.sql.gz', 'rb').read())
          open(os.environ['SNAPSHOT_FILENAME'], 'wb').write(enc)
          "
          rclone copy "$SNAPSHOT_FILENAME" "${RCLONE_REMOTE}hassan_shops/"

      - name: Start Django Server & Permanent Cloudflare Tunnel
        run: |
          touch django.log tunnel.log
          PYTHONUNBUFFERED=1 python -u manage.py runserver 0.0.0.0:8000 > django.log 2>&1 &
          cloudflared tunnel run --token ${{ secrets.CLOUDFLARE_TOKEN }} > tunnel.log 2>&1 &
          sleep 6

      - name: Get Public IP & Send Notification to ntfy
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me || curl -s api.ipify.org)
          MESSAGE="Django App Live! 🚀 (Local Runner DB, latest snapshot restored)
          Domain: https://shops.hadi88.online
          Direct IP: http://$PUBLIC_IP:8000"
          curl -d "$MESSAGE" ntfy.sh/hshshehgag

      - name: Realtime HTTP Access Logs & Error Stream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          for i in {1..62}; do
            for s in {1..60}; do
              LATEST_RUN_ID=$(gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || echo "$CURRENT_RUN_ID")
              if [ "$LATEST_RUN_ID" -gt "$CURRENT_RUN_ID" ]; then
                echo "Newer run ($LATEST_RUN_ID) detected. Taking validated snapshot before exiting..."
                "$HOME/snapshot.sh" || true
                exit 0
              fi
              sleep 5
            done
            echo "--- SERVER HTTP ACCESS LOGS ---"
            grep -E '"GET|POST|PUT|DELETE|HEAD' django.log | tail -n 50 || echo "No HTTP requests logged yet."
          done || true

      # Runs on success, failure, cancel AND timeout. Only saves when the dump is validated.
      - name: Create Validated Final DB Snapshot
        if: always()
        run: |
          "$HOME/snapshot.sh"

      - name: Save Updated DB Dump to GitHub Cache
        if: ${{ always() && env.DUMP_OK == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            local_data_dump.sql.gz
            cache_time.txt
          # run_attempt makes the key unique on "Re-run jobs" (same run_id would silently NOT save)
          key: mysql-db-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
