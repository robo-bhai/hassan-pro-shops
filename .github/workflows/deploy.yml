name: Django CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: django-production-runner
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SALT_KEY: ${{ secrets.DJANGO_SALT_KEY }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      SUPERUSER_NAME: ${{ secrets.SUPERUSER_NAME }}
      SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      CSRF_TRUSTED_ORIGINS: ${{ secrets.CSRF_TRUSTED_ORIGINS }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymysql gunicorn "django-import-export>=3.3.0" "django>=5.2,<5.3" django-dbbackup django-axes reportlab openpyxl pillow python-barcode qrcode cryptography requests django-pwa whitenoise

      - name: Diagnose Database
        run: |
          DIAG_RESULT=$(python -c "
          import time, pymysql, os
          start = time.time()
          try:
              conn = pymysql.connect(
                  host=os.environ['DB_HOST'],
                  user=os.environ['DB_USER'],
                  password=os.environ['DB_PASS'],
                  database=os.environ['DB_NAME'],
                  port=int(os.environ['DB_PORT']),
                  ssl={'ssl-mode': 'REQUIRED'}
              )
              cursor = conn.cursor()
              cursor.execute('SELECT VERSION();')
              db_version = cursor.fetchone()
              end = time.time()
              ms = round((end - start)*1000, 2)
              print(f'SUCCESS: Connected to Aiven MySQL in {ms} ms')
              conn.close()
          except Exception as e:
              print(f'ERROR: Database connection failed: {e}')
          ")
          echo "$DIAG_RESULT"
          curl -s -d "DB Diagnosis Logs: $DIAG_RESULT" ntfy.sh/hshshehgag || true

      - name: Smart Database Migration & Schema Sync
        run: |
          python -c "
          import os, sys, subprocess, pymysql

          def run_cmd(cmd):
              return subprocess.run(cmd, capture_output=True, text=True)

          print('Executing initial database migration...')
          res = run_cmd(['python', 'manage.py', 'migrate'])
          print(res.stdout)

          if res.returncode != 0:
              err = res.stderr
              print('Migration Issue Detected:\n', err)
              
              if 'doesn\'t exist' in err or 'Unknown column' in err or 'KeyError' in err:
                  print('⚠️ Table mismatch detected! Rebuilding app schema...')
                  try:
                      conn = pymysql.connect(
                          host=os.environ['DB_HOST'],
                          user=os.environ['DB_USER'],
                          password=os.environ['DB_PASS'],
                          database=os.environ['DB_NAME'],
                          port=int(os.environ['DB_PORT']),
                          ssl={'ssl-mode': 'REQUIRED'}
                      )
                      cursor = conn.cursor()
                      cursor.execute('SET FOREIGN_KEY_CHECKS = 0;')
                      
                      cursor.execute(\"SHOW TABLES LIKE 'app_%';\")
                      tables = cursor.fetchall()
                      for table in tables:
                          table_name = table[0]
                          cursor.execute(f'DROP TABLE IF EXISTS `{table_name}`;')
                      
                      cursor.execute(\"DELETE FROM django_migrations WHERE app = 'app';\")
                      cursor.execute('SET FOREIGN_KEY_CHECKS = 1;')
                      conn.commit()
                      conn.close()
                      print('Reset app tables. Re-running migrations...')
                  except Exception as e:
                      print(f'Database cleanup warning: {e}')

                  run_cmd(['python', 'manage.py', 'migrate', '--run-syncdb'])
                  final_res = run_cmd(['python', 'manage.py', 'migrate'])
                  sys.exit(final_res.returncode)

              elif 'already exists' in err:
                  print('⚠️ Tables exist without record. Faking unapplied migrations...')
                  fake_res = run_cmd(['python', 'manage.py', 'migrate', '--fake'])
                  sys.exit(fake_res.returncode)

              sys.exit(res.returncode)
          else:
              print('✅ All database tables and migrations are up to date!')
          "

      - name: Create Default Superuser
        run: |
          python manage.py shell -c "
          import os
          from django.contrib.auth.models import User
          username = os.environ.get('SUPERUSER_NAME')
          email = os.environ.get('SUPERUSER_EMAIL')
          password = os.environ.get('SUPERUSER_PASSWORD')
          if username and password:
              if not User.objects.filter(username=username).exists():
                  User.objects.create_superuser(username, email, password)
                  print('Superuser created successfully.')
              else:
                  print('Superuser already exists.')
          else:
              print('Skipping superuser creation: Credentials not provided in secrets.')
          "

      - name: Process & Place PWA Icons from Project Root
        run: |
          python -c "
          import os
          from PIL import Image

          project_dir = os.getcwd()
          target_dir = os.path.join(project_dir, 'ceo_module', 'static', 'ceo', 'images')
          os.makedirs(target_dir, exist_ok=True)

          extensions = ('.png', '.jpg', '.jpeg', '.webp')
          found_images = [
              os.path.join(project_dir, f) for f in os.listdir(project_dir)
              if f.lower().endswith(extensions)
          ]

          if not found_images:
              print('No source image found in Project Root directory to resize.')
          else:
              source_img_path = found_images[0]
              print(f'Processing source image: {source_img_path}')

              sizes = [(192, 192, 'icon-192.png'), (512, 512, 'icon-512.png')]

              with Image.open(source_img_path) as img:
                  img = img.convert('RGBA')
                  for width, height, filename in sizes:
                      resized_img = img.resize((width, height), Image.Resampling.LANCZOS)
                      output_path = os.path.join(target_dir, filename)
                      resized_img.save(output_path, 'PNG')
                      print(f'Saved: {output_path}')
          "

      - name: Collect Static Files
        run: |
          python manage.py collectstatic --noinput

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Check and Kill Existing Local Processes
        run: |
          echo "Cleaning up any old Django or Cloudflared instances..."
          pkill -f "manage.py runserver" || true
          pkill -f "cloudflared" || true
          sleep 2

      - name: Start Django Server & Permanent Cloudflare Tunnel
        run: |
          touch django.log tunnel.log

          PYTHONUNBUFFERED=1 python -u manage.py runserver 0.0.0.0:8000 > django.log 2>&1 &
          cloudflared tunnel run --token ${{ secrets.CLOUDFLARE_TOKEN }} > tunnel.log 2>&1 &
          
          sleep 6
          echo "=== SERVER & CLOUDFLARE TUNNEL LIVE ==="

      - name: Get Public IP & Send Notification to ntfy
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me || curl -s api.ipify.org)
          echo "GitHub Runner Public IP: $PUBLIC_IP"
          
          MESSAGE="Django App Live! 🚀
          Domain: https://shops.hadi88.online
          Direct IP: http://$PUBLIC_IP:8000"
          
          curl -s -d "$MESSAGE" ntfy.sh/hshshehgag || true

      - name: Server Sanity & Short Access Log Inspection
        run: |
          echo "=========================================="
          echo "       VERIFYING RUNNING PROCESSES        "
          echo "=========================================="
          sleep 10
          ps aux | grep -E "manage.py|cloudflared"
          
          echo "--- RECENT DJANGO LOGS ---"
          cat django.log | tail -n 20
          
          echo "--- RECENT TUNNEL LOGS ---"
          cat tunnel.log | tail -n 20

      - name: Keep Server & Cloudflare Tunnel Alive (5 Hours Hold)
        run: |
          echo "=================================================="
          echo " 🚀 SERVER & CLOUDFLARE TUNNEL LIVE FOR 5 HOURS "
          echo " URL: https://shops.hadi88.online "
          echo "=================================================="
          
          for i in {1..30}; do
            sleep 600
            echo "--- [Check $i/30] Time Passed: $((i * 10)) Mins ---"
            echo "Latest Requests Logged:"
            grep -E '"GET|POST|PUT|DELETE|HEAD' django.log | tail -n 5 || echo "No new requests."
          done
          
          echo "5 Hours hold period completed. Pipeline stopping."

      - name: Full Dump of Logs On Workflow Stop or Error
        if: always()
        run: |
          echo "=========================================="
          echo "       COMPLETE DJANGO SERVER LOGS        "
          echo "=========================================="
          cat django.log || echo "django.log is empty."
          echo "=========================================="
          echo "       COMPLETE CLOUDFLARE TUNNEL LOGS    "
          echo "=========================================="
          cat tunnel.log || echo "tunnel.log is empty."
