name: Cache keep-alive

on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - name: Touch latest snapshot (7-din eviction se bachao)
        id: r
        uses: actions/cache/restore@v4
        with:
          path: snapshot
          key: mysql-snap-ok-keepalive-nomatch-${{ github.run_id }}
          restore-keys: |
            mysql-snap-ok-

      - name: Verify snapshot exists and is intact
        run: |
          if [ -z "${{ steps.r.outputs.cache-matched-key }}" ]; then
            echo "::error::GitHub Cache mein koi snapshot nahi mila!"
            exit 1
          fi
          cd snapshot
          sha256sum -c snap.sha256
