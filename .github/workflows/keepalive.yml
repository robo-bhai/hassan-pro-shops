name: Cache keep-alive
on:
  schedule: [{ cron: "17 3 */2 * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - id: r
        uses: actions/cache/restore@v4
        with:
          path: snapshot
          key: mysql-snap-ok-keepalive-nomatch
          restore-keys: mysql-snap-ok-
      - run: |
          test -n "${{ steps.r.outputs.cache-matched-key }}" || { echo "::error::No snapshot in cache!"; exit 1; }
          cd snapshot && sha256sum -c snap.sha256
