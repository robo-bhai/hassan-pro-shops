{% extends 'base.html' %}
{% load static %}

{% block title %}Create Loan{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h5><i class="bi bi-plus-circle text-primary"></i> Create Loan</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Borrower</label>
                                <select name="borrower" class="form-select" required>
                                    <option value="">Select Borrower</option>
                                    {% for borrower in borrowers %}
                                    <option value="{{ borrower.id }}">{{ borrower.name }} ({{ borrower.borrower_code }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Loan Type</label>
                                <select name="loan_type" class="form-select" required>
                                    {% for key, value in loan_types %}
                                    <option value="{{ key }}">{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Provider</label>
                                <select name="provider" class="form-select">
                                    <option value="">Select Provider</option>
                                    {% for provider in providers %}
                                    <option value="{{ provider.id }}">{{ provider.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Principal Amount</label>
                                <input type="number" name="principal" class="form-control" step="0.01" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Interest Rate (%)</label>
                                <input type="number" name="interest_rate" class="form-control" step="0.01" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Processing Fee</label>
                                <input type="number" name="processing_fee" class="form-control" step="0.01">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Late Fee/Day</label>
                                <input type="number" name="late_fee_per_day" class="form-control" step="0.01">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Tenure (Months)</label>
                                <input type="number" name="tenure_months" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" name="start_date" class="form-control" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">End Date</label>
                                <input type="date" name="end_date" class="form-control" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Collateral Type</label>
                            <input type="text" name="collateral_type" class="form-control" placeholder="e.g., Property, Vehicle">
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Collateral Value</label>
                                <input type="number" name="collateral_value" class="form-control" step="0.01">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Collateral Description</label>
                                <input type="text" name="collateral_description" class="form-control">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="2"></textarea>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            EMI schedule will be generated automatically after loan creation.
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Create Loan
                            </button>
                            <a href="{% url 'loan_list' %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
