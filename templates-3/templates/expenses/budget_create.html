{% extends "base.html" %}
{% load static %}

{% block title %}Create Budget - ERP System{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>📊 Create New Budget</h2>
                <a href="{% url 'expense_budget_list' %}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Budget Name <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" required placeholder="e.g., Marketing Budget 2024">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Category <span class="text-danger">*</span></label>
                                <select name="category" class="form-select" required>
                                    <option value="">Select Category</option>
                                    {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.get_full_path }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Budget Period <span class="text-danger">*</span></label>
                                <select name="budget_period" class="form-select" required>
                                    {% for key, value in budget_periods %}
                                    <option value="{{ key }}">{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Period Start <span class="text-danger">*</span></label>
                                <input type="date" name="period_start" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Period End <span class="text-danger">*</span></label>
                                <input type="date" name="period_end" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Allocated Amount (Rs.) <span class="text-danger">*</span></label>
                                <input type="number" name="allocated_amount" class="form-control" step="0.01" required placeholder="0.00">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Notes</label>
                                <textarea name="notes" class="form-control" rows="2"></textarea>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'expense_budget_list' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Create Budget
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
