{% extends "base.html" %}
{% load static %}

{% block title %}Reject Request - {{ request.full_name }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="bi bi-x-circle"></i> Reject Request</h4>
                </div>
                <div class="card-body">
                    <div class="text-center py-3">
                        <i class="bi bi-person-x fs-1 text-danger"></i>
                        <h5 class="mt-3">Reject registration for:</h5>
                        <p><strong>{{ request.full_name }}</strong></p>
                        <p class="text-muted">{{ request.email }}</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="reason" class="form-label">Rejection Reason</label>
                            <textarea class="form-control" id="reason" name="reason" rows="3" 
                                      placeholder="Why is this request being rejected?"></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'shareholder_request_detail' request.id %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="bi bi-x-circle"></i> Yes, Reject
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
