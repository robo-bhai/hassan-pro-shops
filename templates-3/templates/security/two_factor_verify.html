{% extends 'base.html' %}
{% load static %}

{% block title %}Verify 2FA{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h5><i class="bi bi-shield-check text-primary"></i> Verify 2FA</h5>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-envelope display-1 text-primary"></i>
                        <p class="text-muted">Enter the OTP sent to your email/phone</p>
                    </div>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">OTP Code</label>
                            <input type="text" name="otp_code" class="form-control text-center" placeholder="123456" maxlength="6" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-check-circle"></i> Verify
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
