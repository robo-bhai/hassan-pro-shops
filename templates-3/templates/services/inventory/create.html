{% extends "base.html" %}
{% load static %}

{% block title %}Add Service Inventory Item - ERP System{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>➕ Add Service Inventory Item</h2>
                <a href="{% url 'service_inventory_list' %}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Basic Information -->
                        <h5 class="mb-3">📋 Basic Information</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Item Name <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" required placeholder="e.g., AC Compressor">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Item Type <span class="text-danger">*</span></label>
                                <select name="item_type" class="form-select" required>
                                    <option value="">Select Type</option>
                                    {% for key, value in item_types %}
                                    <option value="{{ key }}">{{ value|safe }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Category</label>
                                <select name="category" class="form-select">
                                    <option value="">Select Category</option>
                                    {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Product Reference</label>
                                <select name="product" class="form-select">
                                    <option value="">Select Product</option>
                                    {% for product in products %}
                                    <option value="{{ product.id }}">{{ product.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="2"></textarea>
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <!-- Stock Management -->
                        <h5 class="mb-3">📊 Stock Management</h5>
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Current Stock <span class="text-danger">*</span></label>
                                <input type="number" name="current_stock" class="form-control" step="0.01" required value="0">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Min Stock</label>
                                <input type="number" name="min_stock" class="form-control" step="0.01" value="5">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Reorder Level</label>
                                <input type="number" name="reorder_level" class="form-control" step="0.01" value="10">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Reorder Quantity</label>
                                <input type="number" name="reorder_quantity" class="form-control" step="0.01" value="20">
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <!-- Pricing -->
                        <h5 class="mb-3">💰 Pricing</h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Unit Cost (Rs.) <span class="text-danger">*</span></label>
                                <input type="number" name="unit_cost" class="form-control" step="0.01" required value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Selling Price (Rs.)</label>
                                <input type="number" name="selling_price" class="form-control" step="0.01" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Markup %</label>
                                <input type="number" name="markup_percent" class="form-control" step="0.01" value="20">
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <!-- Location & Supplier -->
                        <h5 class="mb-3">📍 Location & Supplier</h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Unit</label>
                                <select name="unit" class="form-select">
                                    <option value="">Select Unit</option>
                                    {% for unit in units %}
                                    <option value="{{ unit.id }}">{{ unit.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Warehouse</label>
                                <select name="warehouse" class="form-select">
                                    <option value="">Select Warehouse</option>
                                    {% for warehouse in warehouses %}
                                    <option value="{{ warehouse.id }}">{{ warehouse.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Shelf Location</label>
                                <input type="text" name="shelf_location" class="form-control" placeholder="A-1, B-2">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Preferred Supplier</label>
                                <select name="supplier" class="form-select">
                                    <option value="">Select Supplier</option>
                                    {% for supplier in suppliers %}
                                    <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Barcode</label>
                                <input type="text" name="barcode" class="form-control" placeholder="Enter barcode">
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <!-- Settings -->
                        <h5 class="mb-3">⚙️ Settings</h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input type="checkbox" name="is_active" class="form-check-input" id="isActive" checked>
                                    <label class="form-check-label" for="isActive">Active</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input type="checkbox" name="is_consumable" class="form-check-input" id="isConsumable">
                                    <label class="form-check-label" for="isConsumable">Consumable</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input type="checkbox" name="is_serialized" class="form-check-input" id="isSerialized">
                                    <label class="form-check-label" for="isSerialized">Serialized</label>
                                </div>
                            </div>
                        </div>
                        
                        <hr class="my-4">
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'service_inventory_list' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Create Item
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
