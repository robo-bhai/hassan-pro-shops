{% extends 'base.html' %}
{% load static %}

{% block title %}Report Bug{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h5><i class="bi bi-bug text-danger"></i> Report Bug</h5>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3" required></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Severity</label>
                                <select name="severity" class="form-select">
                                    {% for key, value in severity_choices %}
                                    <option value="{{ key }}">{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Module</label>
                                <input type="text" name="module" class="form-control" placeholder="e.g., Sales Module">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Steps to Reproduce</label>
                            <textarea name="steps_to_reproduce" class="form-control" rows="3" required></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Actual Result</label>
                                <textarea name="actual_result" class="form-control" rows="2" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Expected Result</label>
                                <textarea name="expected_result" class="form-control" rows="2" required></textarea>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label">Browser</label>
                                <input type="text" name="browser" class="form-control" placeholder="Chrome, Firefox">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">OS</label>
                                <input type="text" name="os" class="form-control" placeholder="Windows, Mac">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Device</label>
                                <input type="text" name="device" class="form-control" placeholder="Desktop, Mobile">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Test Case (Optional)</label>
                                <select name="test_case" class="form-select">
                                    <option value="">None</option>
                                    {% for case in test_cases %}
                                    <option value="{{ case.id }}">{{ case.title }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Assign To</label>
                                <select name="assigned_to" class="form-select">
                                    <option value="">Select User</option>
                                    {% for user in users %}
                                    <option value="{{ user.id }}">{{ user.username }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Screenshot</label>
                                <input type="file" name="screenshot" class="form-control" accept="image/*">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Attachment</label>
                                <input type="file" name="attachment" class="form-control">
                            </div>
                        </div>
                        
                        <div class="mt-3 d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-bug"></i> Report Bug
                            </button>
                            <a href="{% url 'bug_list' %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
