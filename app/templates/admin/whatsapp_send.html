{% extends "admin/base_site.html" %}
{% block content %}
<h1>📱 Send WhatsApp Message</h1>

<div style="background: white; padding: 20px; border-radius: 10px;">
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label>Select Customer:</label>
            <select name="customer_id" style="width: 100%; padding: 10px; border-radius: 5px;">
                {% for c in customers %}
                <option value="{{ c.id }}">{{ c.name }} - {{ c.contact_number }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Message Type:</label>
            <select name="msg_type" style="width: 100%; padding: 10px; border-radius: 5px;">
                <option value="invoice">Invoice</option>
                <option value="reminder">Payment Reminder</option>
                <option value="order">Order Confirmation</option>
            </select>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Message:</label>
            <textarea name="message" rows="5" style="width: 100%; padding: 10px; border-radius: 5px;" placeholder="Custom message (optional)"></textarea>
        </div>
        
        <button type="submit" style="background: #25D366; color: white; padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">
            📱 Send WhatsApp
        </button>
    </form>
</div>
{% endblock %}
