<!-- templates/admin/cash_flow_report.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Cash Flow Statement - {{ month }}</title>
    <style>
        table { border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid black; padding: 8px; text-align: right; }
        th { background-color: #f2f2f2; }
        .total { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Cash Flow Statement for {{ month }}</h1>
    <table>
        <tr>
            <th>Description</th>
            <th>Amount (PKR)</th>
        </tr>
        <tr>
            <td>Cash Inflows</td>
            <td>{{ cash_in|floatformat:2 }}</td>
        </tr>
        <tr>
            <td>Cash Outflows</td>
            <td>{{ cash_out|floatformat:2 }}</td>
        </tr>
        <tr class="total">
            <td>Net Cash Flow</td>
            <td>{{ net_cash|floatformat:2 }}</td>
        </tr>
    </table>
    <p>Generated on: {{ date }}</p>
</body>
</html>
