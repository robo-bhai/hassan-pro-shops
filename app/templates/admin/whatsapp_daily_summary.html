{% extends "admin/base_site.html" %}
{% block content %}
<h1>📊 Daily Summary on WhatsApp</h1>

<div style="background: white; padding: 20px; border-radius: 10px;">
    <p>Roz raat ko apne WhatsApp pe poore din ki summary bhejne ke liye link generate karo.</p>
    
    <form method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label>Owner WhatsApp Number:</label>
            <input type="text" name="phone" placeholder="03001234567" 
                   style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #25D366; font-size: 16px;">
        </div>
        
        <button type="submit" style="background: #25D366; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer;">
            📊 Generate Daily Summary
        </button>
    </form>
    
    {% if result %}
    <div style="margin-top: 20px; padding: 20px; background: #f0fff0; border-radius: 10px; border-left: 5px solid #25D366;">
        <h3>✅ Link Generated!</h3>
        <a href="{{ result.url }}" target="_blank" style="display: inline-block; background: #25D366; color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-size: 16px; margin-top: 10px;">
            📱 Open WhatsApp & Send
        </a>
    </div>
    {% endif %}
</div>
{% endblock %}
