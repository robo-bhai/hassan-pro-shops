<!-- templates/admin/pnl_report.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Profit & Loss Statement - {{ month }}</title>
    <style>
        table { border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid black; padding: 8px; text-align: right; }
        th { background-color: #f2f2f2; }
        .total { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Profit & Loss Statement for {{ month }}</h1>
    <table>
        <tr>
            <th>Description</th>
            <th>Amount (PKR)</th>
        </tr>
        <tr>
            <td>Total Income</td>
            <td>{{ income|floatformat:2 }}</td>
        </tr>
        <tr>
            <td>Total Expenses</td>
            <td>{{ expenses|floatformat:2 }}</td>
        </tr>
        <tr class="total">
            <td>Net Profit</td>
            <td>{{ profit|floatformat:2 }}</td>
        </tr>
    </table>
    <p>Generated on: {{ date }}</p>
</body>
</html>
