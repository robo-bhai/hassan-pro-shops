<!DOCTYPE html>
<html>
<head>
    <title>Balance Sheet - {{ month }}</title>
</head>
<body>
    <h1>Balance Sheet for {{ month }}</h1>
    <table border="1">
        <tr><th>Assets</th><td>{{ assets|floatformat:2 }} PKR</td></tr>
        <tr><th>Liabilities</th><td>{{ liabilities|floatformat:2 }} PKR</td></tr>
        <tr><th>Equity</th><td>{{ equity|floatformat:2 }} PKR</td></tr>
    </table>
</body>
</html>
