<div class="stat-card animate-up animate-up-{{ delay|default:'1' }}">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <p class="stat-label mb-1">{{ label }}</p>
            <h3 class="stat-value">{{ value }}</h3>
            {% if trend %}
            <small class="{% if trend_type == 'up' %}text-success{% else %}text-danger{% endif %}">
                <i class="bi bi-arrow-{{ trend_type }}"></i> {{ trend }}
            </small>
            {% endif %}
        </div>
        <div class="stat-icon bg-{{ color|default:'primary' }} bg-opacity-10 text-{{ color|default:'primary' }}">
            <i class="bi bi-{{ icon|default:'circle' }}"></i>
        </div>
    </div>
</div>
