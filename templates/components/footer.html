<footer class="app-footer text-center text-muted mt-4 pt-2 pb-3" role="contentinfo">
    <hr class="mb-3 opacity-25">
    <div class="app-footer-inner d-flex flex-column flex-md-row justify-content-center align-items-center gap-1 gap-md-3">
        <span>&copy; {% now "Y" %} <strong>{{ company_name|default:'ERP System' }}</strong>. All rights reserved.</span>
        {% if app_version %}
        <span class="app-footer-version badge rounded-pill bg-light text-secondary border">v{{ app_version }}</span>
        {% endif %}
    </div>
</footer>

<style>
    .app-footer { font-size: 0.8rem; letter-spacing: 0.01em; }
    .app-footer strong { font-weight: 600; color: #495057; }
    .app-footer-version { font-weight: 500; font-size: 0.7rem; }
    @media print { .app-footer { display: none; } }
</style>
