<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ company_name }}{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    {% block extra_css %}{% endblock %}
    
    <style>
        /* ✅ Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            min-height: 100vh;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        .clean-container {
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
        }
        
        .clean-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .clean-card:hover {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);
        }
        
        .clean-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 32px 35px;
        }
        
        .clean-body {
            padding: 30px 35px;
            background: #fafbfc;
        }
        
        .clean-footer {
            background: #ffffff;
            padding: 20px 35px;
            border-top: 1px solid #eef0f3;
        }
        
        .company-logo {
            max-height: 60px;
            object-fit: contain;
        }
        
        /* ✅ Custom scrollbar */
        .terms-scroll {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 15px;
        }
        
        .terms-scroll::-webkit-scrollbar {
            width: 6px;
        }
        
        .terms-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .terms-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }
        
        .terms-scroll::-webkit-scrollbar-thumb:hover {
            background: #5a67d8;
        }
        
        /* ✅ Alert messages */
        .alert-container {
            margin-bottom: 20px;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            padding: 15px 20px;
        }
        
        .alert-success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
        }
        
        .alert-danger {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
        }
        
        .alert-warning {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
            color: #856404;
        }
        
        .alert-info {
            background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
            color: #0c5460;
        }
        
        /* ========================================== */
        /* ✅ TERMS PAGE SPECIFIC STYLES             */
        /* ========================================== */
        
        /* Tabs Styles */
        .terms-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 0;
            border-bottom: 2px solid #e2e8f0;
            background: #f8f9fc;
            border-radius: 0;
            overflow: hidden;
        }
        
        .terms-tab {
            padding: 14px 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            background: transparent;
            transition: all 0.3s ease;
            color: #6b7280;
            position: relative;
            flex: 1;
            text-align: center;
        }
        
        .terms-tab:hover {
            background: rgba(102, 126, 234, 0.05);
            color: #1a1a2e;
        }
        
        .terms-tab.active {
            color: #1a1a2e;
            background: white;
            border-bottom: 3px solid #667eea;
        }
        
        .terms-tab i {
            margin-right: 8px;
        }
        
        .terms-tab .badge-tab {
            background: #667eea;
            color: white;
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 6px;
        }
        
        .terms-tab.active .badge-tab {
            background: #28a745;
        }
        
        /* Tab Content */
        .tab-content {
            display: none;
            padding: 25px 30px;
            background: white;
            animation: fadeIn 0.3s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Terms Content */
        .terms-content {
            font-size: 14px;
            line-height: 1.8;
            color: #4a5568;
        }
        
        .terms-content h1 {
            font-size: 1.6rem;
            color: #1a1a2e;
            margin-top: 25px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        
        .terms-content h1:first-child {
            margin-top: 0;
        }
        
        .terms-content h2 {
            font-size: 1.25rem;
            color: #2d3748;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        
        .terms-content h3 {
            font-size: 1rem;
            color: #4a5568;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .terms-content p {
            line-height: 1.9;
            color: #4a5568;
            margin-bottom: 12px;
        }
        
        .terms-content ul, .terms-content ol {
            padding-left: 25px;
            margin-bottom: 15px;
        }
        
        .terms-content ul li, .terms-content ol li {
            line-height: 1.9;
            color: #4a5568;
            margin-bottom: 6px;
        }
        
        .terms-content ul li::marker {
            color: #667eea;
        }
        
        .terms-content ol li::marker {
            color: #667eea;
            font-weight: 600;
        }
        
        .terms-content strong {
            color: #1a1a2e;
        }
        
        .terms-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        
        .terms-content table th,
        .terms-content table td {
            border: 1px solid #e2e8f0;
            padding: 10px 15px;
            text-align: left;
        }
        
        .terms-content table th {
            background: #f1f4f9;
            font-weight: 600;
        }
        
        .business-model-box {
            background: linear-gradient(135deg, #f8f9fc 0%, #eef0f3 100%);
            border-left: 4px solid #28a745;
            border-radius: 8px;
            padding: 18px 22px;
            margin: 15px 0;
        }
        
        .business-model-box h4 {
            color: #1a1a2e;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .business-model-box ul {
            margin-bottom: 0;
        }
        
        /* ✅ Urdu Styles */
        .urdu-text {
            font-family: 'Noto Naskh Arabic', 'Amiri', 'Scheherazade', serif;
            direction: rtl;
            text-align: right;
        }
        
        .urdu-text ul {
            padding-right: 25px;
            padding-left: 0;
        }
        
        .urdu-text h1,
        .urdu-text h2,
        .urdu-text h3,
        .urdu-text h4,
        .urdu-text p,
        .urdu-text li {
            direction: rtl;
            text-align: right;
        }
        
        .urdu-text table th,
        .urdu-text table td {
            text-align: right;
            direction: rtl;
        }
        
        .urdu-text .business-model-box {
            border-left: none;
            border-right: 4px solid #28a745;
        }
        
        /* ✅ Version Badge */
        .version-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-right: 8px;
            margin-bottom: 5px;
        }
        
        /* ✅ Buttons */
        .btn-agree {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            padding: 14px 45px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            color: white;
            border-radius: 50px;
        }
        
        .btn-agree:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.35);
            color: white;
        }
        
        .btn-agree:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #6c757d;
        }
        
        .btn-decline {
            padding: 14px 45px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            border-radius: 50px;
        }
        
        .btn-decline:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.15);
        }
        
        .checkbox-custom {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #28a745;
            flex-shrink: 0;
        }
        
        .checkbox-label {
            font-size: 1.05rem;
            cursor: pointer;
            color: #1a1a2e;
        }
        
        .checkbox-label strong {
            color: #1a1a2e;
        }
        
        .terms-alert {
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e4f7 100%);
            border: none;
            border-radius: 12px;
            padding: 18px 22px;
        }
        
        /* ✅ Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .clean-header {
                padding: 20px;
            }
            
            .clean-body {
                padding: 20px;
            }
            
            .clean-footer {
                padding: 15px 20px;
            }
            
            .terms-scroll {
                max-height: 300px;
            }
            
            .terms-tab {
                padding: 10px 15px;
                font-size: 0.85rem;
            }
            
            .tab-content {
                padding: 15px 20px;
            }
            
            .btn-agree, .btn-decline {
                width: 100%;
                justify-content: center;
            }
            
            .d-flex.gap-3 {
                flex-direction: column;
            }
        }
        
        @media (max-width: 480px) {
            .clean-header h1 {
                font-size: 1.3rem;
            }
            
            .version-badge {
                font-size: 0.75rem;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="clean-container">
        
        <!-- ✅ Display Messages -->
        {% if messages %}
        <div class="alert-container">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% elif message.tags == 'error' %}x-circle-fill{% elif message.tags == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %} me-2"></i>
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        
        <!-- ✅ Main Content Block -->
        {% block content %}
        {% endblock %}
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
