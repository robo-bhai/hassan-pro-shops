<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ company_name }}{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    {% block extra_css %}{% endblock %}
    
    <style>
        /* ✅ FIX: Full page centering */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            min-height: 100vh;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        .clean-container {
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
        }
        
        .clean-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .clean-card:hover {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);
        }
        
        .clean-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 32px 35px;
        }
        
        .clean-body {
            padding: 30px 35px;
            background: #fafbfc;
        }
        
        .clean-footer {
            background: #ffffff;
            padding: 20px 35px;
            border-top: 1px solid #eef0f3;
        }
        
        .company-logo {
            max-height: 60px;
            object-fit: contain;
        }
        
        /* ✅ Custom scrollbar for terms */
        .terms-scroll {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 15px;
        }
        
        .terms-scroll::-webkit-scrollbar {
            width: 6px;
        }
        
        .terms-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .terms-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }
        
        .terms-scroll::-webkit-scrollbar-thumb:hover {
            background: #5a67d8;
        }
        
        /* ✅ Alert messages styling */
        .alert-container {
            margin-bottom: 20px;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            padding: 15px 20px;
        }
        
        .alert-success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
        }
        
        .alert-danger {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
        }
        
        .alert-warning {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
            color: #856404;
        }
        
        .alert-info {
            background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
            color: #0c5460;
        }
        
        /* ✅ Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .clean-header {
                padding: 20px;
            }
            
            .clean-body {
                padding: 20px;
            }
            
            .clean-footer {
                padding: 15px 20px;
            }
            
            .terms-scroll {
                max-height: 300px;
            }
        }
        
        @media (max-width: 480px) {
            .clean-header h1 {
                font-size: 1.3rem;
            }
            
            .version-badge {
                font-size: 0.75rem;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="clean-container">
        
        <!-- ✅ Display Messages -->
        {% if messages %}
        <div class="alert-container">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% elif message.tags == 'error' %}x-circle-fill{% elif message.tags == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %} me-2"></i>
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        
        <!-- ✅ Main Content Block -->
        {% block content %}
        {% endblock %}
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
