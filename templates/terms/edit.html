{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Terms v{{ terms.version }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Terms v{{ terms.version }}</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Version <span class="text-danger">*</span></label>
                                <input type="text" name="version" class="form-control" value="{{ terms.version }}" required>
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Effective Date</label>
                                <input type="date" name="effective_date" class="form-control" value="{{ terms.effective_date|date:'Y-m-d' }}">
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Status</label>
                                <div class="form-check form-switch mt-2">
                                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if terms.is_active %}checked{% endif %}>
                                    <label class="form-check-label" for="is_active">
                                        {% if terms.is_active %}✅ Active{% else %}Inactive{% endif %}
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" name="title" class="form-control" value="{{ terms.title }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Content <span class="text-danger">*</span></label>
                            <textarea name="content" class="form-control" rows="20" style="font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.8;" required>{{ terms.content }}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'terms_admin' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Update Terms
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
