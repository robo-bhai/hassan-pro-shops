{% extends 'base.html' %}
{% load static %}

{% block title %}Create Terms{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Create New Terms & Conditions</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Version <span class="text-danger">*</span></label>
                                <input type="text" name="version" class="form-control" placeholder="e.g., 1.0" required>
                                <small class="text-muted">Use format: 1.0, 1.1, 2.0, etc.</small>
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Effective Date</label>
                                <input type="date" name="effective_date" class="form-control" value="{{ today }}">
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Status</label>
                                <div class="form-check form-switch mt-2">
                                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" checked>
                                    <label class="form-check-label" for="is_active">Active</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" name="title" class="form-control" value="Shareholder Terms & Conditions">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Content <span class="text-danger">*</span></label>
                            <textarea name="content" class="form-control" rows="20" style="font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.8;" required placeholder="Paste your Terms & Conditions here..."></textarea>
                            <small class="text-muted">Line breaks will be preserved.</small>
                        </div>
                        
                        <div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle"></i>
                            <strong>Note:</strong> Only one version can be active at a time.
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'terms_admin' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-save"></i> Save Terms
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
