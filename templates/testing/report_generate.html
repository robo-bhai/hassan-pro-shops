{% extends 'base.html' %}
{% load static %}

{% block title %}Generate Test Report{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h5><i class="bi bi-file-earmark-text text-primary"></i> Generate Test Report</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Select Project</label>
                            <select name="project" class="form-select" required>
                                <option value="">Select Project</option>
                                {% for project in projects %}
                                <option value="{{ project.id }}">{{ project.name }} (v{{ project.version }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            Report will include:
                            <ul class="mb-0">
                                <li>Test execution summary</li>
                                <li>Pass/Fail breakdown</li>
                                <li>Bug statistics</li>
                                <li>Quality metrics</li>
                            </ul>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-file-earmark-text"></i> Generate Report
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
