{# Shared design system for the Testing module. Include it inside the extra_css block of each page. #}
<style>
:root{
  --qa-ink:#1f2937; --qa-muted:#6b7280; --qa-line:#e8ebf0; --qa-soft:#f6f8fb; --qa-brand:#3b5bdb;
  --qa-red:#d6336c; --qa-danger:#e03131; --qa-orange:#f08c00; --qa-yellow:#e8b100; --qa-green:#2f9e44; --qa-blue:#1c7ed6; --qa-gray:#868e96;
}
.qa-wrap{max-width:1400px;margin:0 auto;padding:18px 16px 40px}
/* ---- page head ---- */
.qa-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.qa-head h1{font-size:1.35rem;font-weight:700;color:var(--qa-ink);margin:0;display:flex;align-items:center;gap:10px}
.qa-head h1 .qa-ico{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#edf2ff;color:var(--qa-brand);font-size:1.05rem}
.qa-head p{margin:2px 0 0;color:var(--qa-muted);font-size:.85rem}
.qa-actions{display:flex;flex-wrap:wrap;gap:8px}
.qa-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--qa-line);background:#fff;color:var(--qa-ink);border-radius:9px;padding:7px 14px;font-size:.84rem;font-weight:600;text-decoration:none;cursor:pointer;transition:.15s}
.qa-btn:hover{background:var(--qa-soft);color:var(--qa-ink)}
.qa-btn.primary{background:var(--qa-brand);border-color:var(--qa-brand);color:#fff}
.qa-btn.primary:hover{background:#2f4ac0;color:#fff}
.qa-btn.danger{background:var(--qa-danger);border-color:var(--qa-danger);color:#fff}
.qa-btn.danger:hover{background:#c92a2a;color:#fff}
.qa-btn.sm{padding:4px 10px;font-size:.76rem;border-radius:7px}
/* ---- section nav ---- */
.qa-nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border:1px solid var(--qa-line);border-radius:12px;padding:5px;margin-bottom:16px;scrollbar-width:none}
.qa-nav::-webkit-scrollbar{display:none}
.qa-nav a{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;color:var(--qa-muted);font-size:.83rem;font-weight:600;text-decoration:none}
.qa-nav a:hover{background:var(--qa-soft);color:var(--qa-ink)}
.qa-nav a.active{background:#edf2ff;color:var(--qa-brand)}
/* ---- cards ---- */
.qa-card{background:#fff;border:1px solid var(--qa-line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.qa-card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--qa-line)}
.qa-card-h h6{margin:0;font-weight:700;font-size:.9rem;color:var(--qa-ink)}
.qa-card-b{padding:16px}
/* ---- KPI ---- */
.qa-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.qa-kpi{background:#fff;border:1px solid var(--qa-line);border-radius:14px;padding:14px 16px;text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden;transition:.15s}
a.qa-kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.08);color:inherit}
.qa-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--qa-brand))}
.qa-kpi .v{font-size:1.65rem;font-weight:800;line-height:1.1;color:var(--qa-ink)}
.qa-kpi .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--qa-muted);font-weight:700;margin-top:3px}
.qa-kpi .s{font-size:.74rem;color:var(--qa-muted);margin-top:4px}
.qa-kpi.active{box-shadow:0 0 0 2px var(--c,var(--qa-brand)) inset}
/* ---- pills ---- */
.qa-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;background:#f1f3f5;color:#495057}
.qa-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.qa-critical,.qa-failed,.qa-new{background:#ffe3e3;color:#c92a2a}
.qa-major,.qa-high,.qa-reopened,.qa-blocked{background:#fff0d6;color:#b35c00}
.qa-minor,.qa-medium,.qa-in_progress,.qa-assigned{background:#dbe9ff;color:#1864ab}
.qa-fixed,.qa-ready{background:#e5dbff;color:#5f3dc4}
.qa-verified,.qa-closed,.qa-passed,.qa-approved,.qa-completed{background:#d3f9d8;color:#2b8a3e}
.qa-trivial,.qa-low,.qa-draft,.qa-duplicate,.qa-won_fix,.qa-review,.qa-pending,.qa-skipped{background:#eceff3;color:#5c6670}
.qa-tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--qa-soft);border:1px solid var(--qa-line);font-size:.72rem;color:var(--qa-muted);font-weight:600}
/* ---- filters ---- */
.qa-filter{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 16px}
.qa-filter .form-control,.qa-filter .form-select{border-radius:9px;border-color:var(--qa-line);font-size:.85rem}
.qa-filter .qa-btn{justify-content:center}
/* ---- table ---- */
.qa-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem}
.qa-table th{background:var(--qa-soft);color:var(--qa-muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;padding:10px 14px;border-bottom:1px solid var(--qa-line);white-space:nowrap}
.qa-table td{padding:12px 14px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
.qa-table tr:last-child td{border-bottom:0}
.qa-table tbody tr.qa-row{cursor:pointer}
.qa-table tbody tr.qa-row:hover{background:#fafbff}
.qa-id{font-weight:700;color:var(--qa-muted);font-variant-numeric:tabular-nums}
.qa-title{font-weight:600;color:var(--qa-ink);display:block}
.qa-sub{color:var(--qa-muted);font-size:.76rem;display:block;margin-top:2px}
.qa-empty{text-align:center;padding:44px 16px;color:var(--qa-muted)}
.qa-empty i{font-size:2.2rem;display:block;margin-bottom:6px;color:#adb5bd}
.qa-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--qa-line);font-size:.82rem;color:var(--qa-muted)}
/* ---- progress ---- */
.qa-bar{height:8px;border-radius:8px;background:#eceff3;overflow:hidden;display:flex}
.qa-bar span{display:block;height:100%}
/* ---- donut ---- */
.qa-donut{--size:128px;width:var(--size);height:var(--size);border-radius:50%;position:relative;flex-shrink:0}
.qa-donut::after{content:"";position:absolute;inset:18px;background:#fff;border-radius:50%}
.qa-donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.qa-donut .c b{font-size:1.4rem;line-height:1;color:var(--qa-ink)}
.qa-donut .c small{font-size:.62rem;color:var(--qa-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.qa-legend{list-style:none;margin:0;padding:0;flex:1;min-width:140px}
.qa-legend li{display:flex;align-items:center;gap:8px;font-size:.82rem;padding:3px 0;color:var(--qa-ink)}
.qa-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.qa-legend b{margin-left:auto;font-variant-numeric:tabular-nums}
/* ---- 7 day trend ---- */
.qa-trend{display:flex;align-items:stretch;gap:8px;height:130px}
.qa-trend>div{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.68rem;color:var(--qa-muted)}
.qa-trend .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.qa-trend .bw span{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#748ffc,#3b5bdb);min-height:4px}
.qa-trend em{font-style:normal;font-weight:700;color:var(--qa-ink);margin-bottom:3px}
/* ---- list rows ---- */
.qa-list{list-style:none;margin:0;padding:0}
.qa-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid #f0f2f5}
.qa-list li:last-child{border-bottom:0}
/* ---- modal / bottom sheet ---- */
.qa-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.qa-ov.open{display:flex}
.qa-modal{background:#fff;border-radius:16px;width:100%;max-width:720px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.qa-modal-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--qa-line);position:sticky;top:0;background:#fff;z-index:1}
.qa-modal-h h5{margin:0;font-size:1.02rem;font-weight:700;color:var(--qa-ink)}
.qa-x{border:0;background:var(--qa-soft);width:32px;height:32px;border-radius:50%;font-size:1rem;color:var(--qa-muted);flex-shrink:0}
.qa-modal-b{padding:16px 18px}
.qa-sec{margin-bottom:14px}
.qa-sec h6{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--qa-muted);font-weight:800;margin:0 0 5px}
.qa-sec p,.qa-sec div.t{margin:0;font-size:.88rem;color:var(--qa-ink);white-space:pre-wrap;word-break:break-word}
.qa-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--qa-soft);border:1px solid var(--qa-line);border-radius:8px;padding:9px 11px;font-size:.8rem}
.qa-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--qa-soft);border-radius:10px;padding:12px;margin-bottom:14px}
.qa-meta small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--qa-muted);font-weight:700}
.qa-meta span{font-size:.85rem;font-weight:600;color:var(--qa-ink)}
.qa-tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--qa-line)}
.qa-tl li{position:relative;padding:0 0 10px 12px;font-size:.82rem;color:var(--qa-ink)}
.qa-tl li::before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--qa-brand);border:2px solid #fff;box-shadow:0 0 0 1px var(--qa-line)}
.qa-tl li small{color:var(--qa-muted);display:block}
.qa-modal-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 18px;border-top:1px solid var(--qa-line);background:var(--qa-soft);border-radius:0 0 16px 16px}
.qa-modal-f select{border-radius:9px;border:1px solid var(--qa-line);padding:7px 10px;font-size:.84rem;flex:1;min-width:150px}
@media(max-width:640px){
  .qa-ov{align-items:flex-end;padding:0}
  .qa-modal{max-width:100%;border-radius:18px 18px 0 0;max-height:90vh}
  .qa-head h1{font-size:1.15rem}
  .qa-table th,.qa-table td{padding:10px 10px}
}
</style>
