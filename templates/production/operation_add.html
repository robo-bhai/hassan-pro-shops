{% extends 'base.html' %}
{% block title %}Add Operation{% endblock %}
{% block page_title %}➕ Add Production Operation{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h5>Add Operation - {{ order.product.name }}</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Operation Type *</label>
                            <select name="operation_type" class="form-select" required>
                                {% for type in operation_types %}
                                <option value="{{ type.0 }}">{{ type.1 }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Operation Name *</label>
                            <input type="text" name="operation_name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Sequence (Order) *</label>
                            <input type="number" name="sequence" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Assigned To</label>
                            <select name="assigned_to" class="form-select">
                                <option value="">-- Select Employee --</option>
                                {% for emp in employees %}
                                <option value="{{ emp.id }}">{{ emp.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estimated Hours</label>
                            <input type="number" name="estimated_hours" class="form-control" step="0.5" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Labor Cost</label>
                            <input type="number" name="labor_cost" class="form-control" step="100" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Overhead Cost</label>
                            <input type="number" name="overhead_cost" class="form-control" step="100" value="0">
                        </div>
                        <button type="submit" class="btn btn-primary">Add Operation</button>
                        <a href="{% url 'production_order_detail' order.pk %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
