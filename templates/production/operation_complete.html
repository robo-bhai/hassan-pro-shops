{% extends 'base.html' %}
{% block title %}Complete Operation{% endblock %}
{% block page_title %}✅ Complete Operation{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h5>Complete: {{ operation.operation_name }}</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Actual Hours Taken</label>
                            <input type="number" name="actual_hours" class="form-control" step="0.5" required>
                        </div>
                        <button type="submit" class="btn btn-success">Complete Operation</button>
                        <a href="{% url 'production_order_detail' operation.production_order.pk %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
