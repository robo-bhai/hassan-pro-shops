{# Company logo upload / remove. #}
<div class="sc-group mb-4">
    <h6 class="sc-group-title"><i class="bi bi-image me-1"></i> Company Logo</h6>
    <div class="d-flex align-items-center gap-3 flex-wrap">
        {% if company and company.logo %}
            <img src="{{ company.logo.url }}" alt="Logo" style="height:64px;max-width:160px;object-fit:contain;background:#fff;border-radius:10px;padding:4px">
        {% endif %}
        <div class="flex-grow-1">
            <input type="file" name="logo" class="form-control" accept="image/png,image/jpeg,image/webp">
            <div class="form-text">PNG, JPG ya WEBP, 2MB tak.</div>
            {% if company and company.logo %}
            <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" name="remove_logo" id="removeLogo" value="1">
                <label class="form-check-label" for="removeLogo">Maujooda logo hata dein</label>
            </div>
            {% endif %}
        </div>
    </div>
</div>
