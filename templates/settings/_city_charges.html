{# City-wise delivery charges. #}
<div class="sc-group mt-4">
    <h6 class="sc-group-title"><i class="bi bi-geo-alt me-1"></i> City-wise Charges</h6>
    <div id="cityRows">
        {% for c in city_list %}
        <div class="row g-2 mb-2 city-row">
            <div class="col-7"><input type="text" name="city_name[]" class="form-control" value="{{ c.name }}" placeholder="City"></div>
            <div class="col-4"><div class="input-group"><span class="input-group-text">Rs.</span><input type="number" step="any" min="0" name="city_charge[]" class="form-control" value="{{ c.charge }}"></div></div>
            <div class="col-1"><button type="button" class="btn btn-outline-danger w-100 city-del" title="Hatayen"><i class="bi bi-x-lg"></i></button></div>
        </div>
        {% endfor %}
    </div>
    <button type="button" class="btn btn-outline-primary btn-sm" id="cityAdd"><i class="bi bi-plus-lg me-1"></i> City add karein</button>
    <div class="row g-2 mt-3">
        <div class="col-md-6">
            <label class="form-label fw-semibold" for="f_other_city_charge">Baaqi shehron ka charge</label>
            <div class="input-group"><span class="input-group-text">Rs.</span>
                <input type="number" step="any" min="0" class="form-control" id="f_other_city_charge" name="other_city_charge" value="{{ other_charge }}"></div>
        </div>
    </div>
</div>
<script>
(function () {
    var rows = document.getElementById('cityRows');
    function bind(row) { row.querySelector('.city-del').addEventListener('click', function () { row.remove(); }); }
    rows.querySelectorAll('.city-row').forEach(bind);
    document.getElementById('cityAdd').addEventListener('click', function () {
        var d = document.createElement('div');
        d.className = 'row g-2 mb-2 city-row';
        d.innerHTML = '<div class="col-7"><input type="text" name="city_name[]" class="form-control" placeholder="City"></div>' +
            '<div class="col-4"><div class="input-group"><span class="input-group-text">Rs.</span><input type="number" step="any" min="0" name="city_charge[]" class="form-control" value="0"></div></div>' +
            '<div class="col-1"><button type="button" class="btn btn-outline-danger w-100 city-del" title="Hatayen"><i class="bi bi-x-lg"></i></button></div>';
        rows.appendChild(d); bind(d);
    });
})();
</script>
