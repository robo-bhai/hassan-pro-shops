{% extends 'base.html' %}

{% block title %}Settings{% endblock %}
{% block page_title %}⚙️ Company Settings{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6">
        <div class="content-card">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Company Name</label>
                    <input type="text" name="name" class="form-control" value="{{ company.name|default:'' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Address</label>
                    <textarea name="address" class="form-control" rows="3" required>{{ company.address|default:'' }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Contact Number</label>
                    <input type="text" name="contact_number" class="form-control" value="{{ company.contact_number|default:'' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ company.email|default:'' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Footer Note</label>
                    <input type="text" name="footer_note" class="form-control" value="{{ company.footer_note|default:'' }}">
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Settings</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
