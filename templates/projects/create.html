{% extends 'base.html' %}
{% block title %}New Project{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <h4>New Project</h4>
  <form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-md-6"><label class="form-label">Name *</label><input type="text" name="name" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Code</label><input type="text" name="code" class="form-control" placeholder="Auto if empty"></div>
    <div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
    <div class="col-md-6"><label class="form-label">Department</label>
      <select name="department" class="form-select"><option value="">-- None --</option>
      {% for d in departments %}<option value="{{ d.id }}">{{ d }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Status</label>
      <select name="status" class="form-select"><option value="active">Active</option><option value="on_hold">On Hold</option><option value="completed">Completed</option></select></div>
    <div class="col-md-4"><label class="form-label">Start date</label><input type="date" name="start_date" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">End date</label><input type="date" name="end_date" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Budget</label><input type="number" step="0.01" name="budget" value="0" class="form-control"></div>
    <div class="col-12 form-check ms-2"><input type="checkbox" name="is_active" id="ia" class="form-check-input" checked><label for="ia" class="form-check-label">Active</label></div>
    <div class="col-12"><button class="btn btn-primary">Save</button> <a href="{% url 'project_list' %}" class="btn btn-secondary">Cancel</a></div>
  </form>
</div>
{% endblock %}
