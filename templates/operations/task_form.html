{% extends "base.html" %}
{% block title %}{% if is_edit %}Edit{% else %}Create{% endif %} Task{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>{% if is_edit %}✏️ Edit Task{% else %}➕ New Task{% endif %}</h2>
                <a href="{% url 'task_list' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Parent Plan <span class="text-danger">*</span></label>
                                <select name="plan" class="form-select" required>
                                    <option value="">Select Plan</option>
                                    {% for p in plans %}
                                    <option value="{{ p.id }}" 
                                        {% if task.plan_id == p.id %}selected{% elif pre_plan and pre_plan.id == p.id %}selected{% endif %}>
                                        {{ p.plan_no }} - {{ p.title }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-12">
                                <label class="form-label">Task Title <span class="text-danger">*</span></label>
                                <input type="text" name="title" class="form-control" required
                                       value="{{ task.title|default:'' }}"
                                       placeholder="e.g., Call customer for payment">
                            </div>
                            
                            <div class="col-md-12">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="3">{{ task.description|default:'' }}</textarea>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Priority</label>
                                <select name="priority" class="form-select">
                                    {% for value, label in priority_choices %}
                                    <option value="{{ value }}" {% if task.priority == value %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Assigned To</label>
                                <select name="assigned_to" class="form-select">
                                    <option value="">Unassigned</option>
                                    {% for emp in employees %}
                                    <option value="{{ emp.id }}" {% if task.assigned_to_id == emp.id %}selected{% endif %}>
                                        {{ emp.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label">Estimated Hours</label>
                                <input type="number" step="0.5" name="estimated_hours" class="form-control"
                                       value="{{ task.estimated_hours|default:0 }}">
                            </div>
                            
                            <div class="col-md-12">
                                <label class="form-label">Due Date <span class="text-danger">*</span></label>
                                <input type="datetime-local" name="due_date" class="form-control" required
                                       value="{{ task.due_date|date:'Y-m-d\TH:i'|default:tomorrow }}">
                            </div>
                            
                            <div class="col-md-12">
                                <label class="form-label">Notes</label>
                                <textarea name="notes" class="form-control" rows="2">{{ task.notes|default:'' }}</textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg flex-fill">
                        <i class="bi bi-check-circle"></i>
                        {% if is_edit %}Update{% else %}Create{% endif %} Task
                    </button>
                    <a href="{% url 'task_list' %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
