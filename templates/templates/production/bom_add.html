{% extends 'base.html' %}
{% block title %}Add BOM Item{% endblock %}
{% block page_title %}➕ Add Raw Material to BOM{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h5>Add Raw Material - {{ order.product.name }}</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Raw Material *</label>
                            <select name="raw_material" class="form-select" required>
                                <option value="">-- Select --</option>
                                {% for product in products %}
                                <option value="{{ product.id }}">{{ product.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantity Required (per unit) *</label>
                            <input type="number" name="quantity_required" class="form-control" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cost per Unit</label>
                            <input type="number" name="cost_per_unit" class="form-control" step="0.01" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Waste Percentage (%)</label>
                            <input type="number" name="waste_percentage" class="form-control" step="0.1" value="0">
                        </div>
                        <button type="submit" class="btn btn-primary">Add to BOM</button>
                        <a href="{% url 'production_order_detail' order.pk %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
