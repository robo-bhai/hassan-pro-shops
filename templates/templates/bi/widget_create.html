{% extends 'base.html' %}
{% load static %}

{% block title %}Create Widget{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h5><i class="bi bi-plus-circle text-primary"></i> Create Widget</h5>
                    <p class="text-muted small">{{ dashboard.name }}</p>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Widget Title</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Widget Type</label>
                            <select name="widget_type" class="form-select">
                                {% for key, value in widget_types %}
                                <option value="{{ key }}">{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Data Source</label>
                            <select name="data_source" class="form-select">
                                {% for source in data_sources %}
                                <option value="{{ source }}">{{ source|title }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Field</label>
                            <input type="text" name="field" class="form-control" placeholder="e.g., total_amount">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Chart Type</label>
                            <select name="chart_type" class="form-select">
                                <option value="bar">Bar Chart</option>
                                <option value="line">Line Chart</option>
                                <option value="pie">Pie Chart</option>
                                <option value="doughnut">Doughnut Chart</option>
                                <option value="radar">Radar Chart</option>
                            </select>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Create Widget
                            </button>
                            <a href="{% url 'bi_dashboard_edit' dashboard.id %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
