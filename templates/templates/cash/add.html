{% extends 'base.html' %}
{% load static %}

{% block title %}💰 Add Cash to System{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">💰 Add Cash to System</h4>
                </div>
                <div class="card-body">
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Amount -->
                        <div class="form-group mb-3">
                            <label class="fw-bold">Amount *</label>
                            <input type="number" name="amount" class="form-control form-control-lg" 
                                   step="0.01" required placeholder="0.00">
                            <small class="text-muted">Enter amount to add</small>
                        </div>
                        
                        <!-- Source -->
                        <div class="form-group mb-3">
                            <label class="fw-bold">Source</label>
                            <select name="source" class="form-control">
                                {% for value, label in source_options %}
                                    <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                            <small class="text-muted">Where is this money coming from?</small>
                        </div>
                        
                        <!-- Payment Method -->
                        <div class="form-group mb-3">
                            <label class="fw-bold">Payment Method</label>
                            <select name="payment_method" class="form-control">
                                {% for value, label in payment_methods %}
                                    <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <!-- Reference No -->
                        <div class="form-group mb-3">
                            <label class="fw-bold">Reference No</label>
                            <input type="text" name="reference_no" class="form-control" 
                                   placeholder="Transaction reference / Bank ref">
                        </div>
                        
                        <!-- Description -->
                        <div class="form-group mb-3">
                            <label class="fw-bold">Description</label>
                            <textarea name="description" class="form-control" rows="2" 
                                      placeholder="Add description"></textarea>
                        </div>
                        
                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'cash_dashboard' %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-plus-circle"></i> Add Cash
                            </button>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
