{% extends "base.html" %}
{% block title %}Complete Task{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="bi bi-check-circle"></i> Complete Task</h4>
                </div>
                <div class="card-body">
                    <h5>{{ task.title }}</h5>
                    <p class="text-muted">{{ task.description|truncatechars:100 }}</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Actual Hours Spent</label>
                            <input type="number" step="0.5" name="actual_hours" 
                                   class="form-control" value="{{ task.estimated_hours }}">
                            <small class="text-muted">Estimated: {{ task.estimated_hours }}h</small>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-fill">
                                <i class="bi bi-check-circle"></i> Mark as Completed
                            </button>
                            <a href="{% url 'task_detail' task.pk %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
