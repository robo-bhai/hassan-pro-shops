{# Password show/hide eye - har type="password" input par khud lag jata hai #}
<style>
    .pw-wrap { position: relative; display: block; width: 100%; }
    .pw-wrap > input { padding-right: 48px !important; }
    .pw-eye {
        position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
        background: none; border: 0; padding: 6px 8px; cursor: pointer;
        color: #6b7280; font-size: 18px; line-height: 1; z-index: 2;
        -webkit-tap-highlight-color: transparent;
    }
    .pw-eye:hover, .pw-eye.on { color: #2563eb; }
</style>
<script>
(function () {
    function enhance() {
        document.querySelectorAll('input[type="password"]').forEach(function (input) {
            if (input.dataset.pwEye) return;
            input.dataset.pwEye = '1';

            var wrap = document.createElement('div');
            wrap.className = 'pw-wrap';
            input.parentNode.insertBefore(wrap, input);
            wrap.appendChild(input);

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'pw-eye';
            btn.setAttribute('aria-label', 'Show password');
            btn.innerHTML = '<i class="bi bi-eye"></i>';
            wrap.appendChild(btn);

            btn.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.classList.toggle('on', show);
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                btn.firstChild.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
                input.focus();
            });
        });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enhance);
    else enhance();
})();
</script>
