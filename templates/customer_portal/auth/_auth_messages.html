{% if messages %}
    {% for message in messages %}
        <div class="alert-message
            {% if message.tags == 'error' %}alert-error
            {% elif message.tags == 'success' %}alert-success
            {% elif message.tags == 'warning' %}alert-warning
            {% else %}alert-info{% endif %}">
            <i class="bi bi-{% if message.tags == 'error' %}exclamation-circle-fill{% elif message.tags == 'success' %}check-circle-fill{% elif message.tags == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %}"></i>
            <span>{{ message }}</span>
        </div>
    {% endfor %}
{% endif %}
