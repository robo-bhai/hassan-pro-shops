<style>
    .login-container {
        max-width: 450px;
        margin: 40px auto;
        padding: 0 15px;
    }
    
    .login-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        overflow: hidden;
    }
    
    .login-header {
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        color: white;
        padding: 40px 30px 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    
    .login-header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -30%;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
        border-radius: 50%;
    }
    
    .login-icon {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        font-size: 32px;
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
        position: relative;
        z-index: 1;
    }
    
    .login-header h3 {
        margin: 0;
        font-weight: 700;
        font-size: 22px;
        position: relative;
        z-index: 1;
    }
    
    .login-header p {
        margin: 8px 0 0;
        opacity: 0.9;
        font-size: 13px;
        position: relative;
        z-index: 1;
    }
    
    .login-body {
        padding: 30px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        font-weight: 600;
        color: #1a1a2e;
        margin-bottom: 8px;
        font-size: 14px;
    }
    
    .form-group label i {
        color: #2563eb;
        margin-right: 6px;
    }
    
    .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e0e3eb;
        border-radius: 12px;
        font-size: 15px;
        transition: all 0.2s ease;
        background: #f8f9fc;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #2563eb;
        background: white;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }
    
    .btn-login {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }
    
    .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }
    
    .login-footer {
        text-align: center;
        padding: 20px 30px;
        background: #f8f9fc;
        border-top: 1px solid #e0e3eb;
    }
    
    .login-footer p {
        margin: 0;
        font-size: 14px;
        color: #6b7280;
    }
    
    .login-footer a {
        color: #2563eb;
        font-weight: 700;
        text-decoration: none;
    }
    
    .login-footer a:hover {
        text-decoration: underline;
    }
    
    /* Alerts */
    .alert-message {
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .alert-error {
        background: #f8d7da;
        color: #721c24;
        border-left: 4px solid #dc3545;
    }
    
    .alert-success {
        background: #d4edda;
        color: #155724;
        border-left: 4px solid #28a745;
    }
    
    .alert-warning {
        background: #fff3cd;
        color: #856404;
        border-left: 4px solid #ffc107;
    }
    
    .alert-info {
        background: #d1ecf1;
        color: #0c5460;
        border-left: 4px solid #17a2b8;
    }

    body { background: #f3f5ff; }
    .login-card { border-radius: 28px; }
    .login-header { border-radius: 0 0 30px 30px; }
    .form-group input { border-radius: 16px; }
    .btn-login { border-radius: 30px; }
</style>
<style>
    .fp-link { text-align: right; margin: -4px 0 14px; font-size: 13px; }
    .fp-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .fp-hint { font-size: 12.5px; color: #64748b; margin: 6px 0 0; line-height: 1.5; }
    .fp-otp { letter-spacing: 10px; text-align: center; font-size: 24px; font-weight: 700; }
</style>
