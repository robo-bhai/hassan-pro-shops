{% extends 'customer_portal/base_shop.html' %}
{% load static %}

{% block title %}Login - {{ company_name }}{% endblock %}

{% block content %}

<!-- ✅ Hide Mobile Bottom Navigation on Login Page -->
<style>
    .mobile-bottom-nav {
        display: none !important;
    }
    
    body {
        padding-bottom: 20px !important;
    }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card">
                
                <!-- Header -->
                <div class="auth-header">
                    <div class="auth-icon">👤</div>
                    <h2>Welcome Back!</h2>
                    <p class="text-muted">Apne account mein login karein</p>
                </div>
                
                <!-- Form -->
                <form method="POST" class="auth-form" autocomplete="on">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    
                    <!-- Phone -->
                    <div class="form-group">
                        <label>📱 Phone Number</label>
                        <input type="tel" 
                               name="phone" 
                               class="form-control" 
                               placeholder="03001234567"
                               required
                               autofocus
                               autocomplete="tel">
                    </div>
                    
                    <!-- Password -->
                    <div class="form-group">
                        <label>🔒 Password</label>
                        <div class="password-input">
                            <input type="password" 
                                   name="password" 
                                   class="form-control" 
                                   placeholder="Password likhein"
                                   id="password"
                                   required
                                   autocomplete="current-password">
                            <button type="button" 
                                    class="password-toggle" 
                                    onclick="togglePassword('password')">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Forgot Password -->
                    <div class="text-end mb-3">
                        <a href="#" class="small text-primary">Password bhool gaye?</a>
                    </div>
                    
                    <!-- Submit -->
                    <button type="submit" class="btn-auth">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                    
                    <!-- Register Link -->
                    <div class="auth-footer">
                        Naya customer? 
                        <a href="{% url 'customer_register' %}" class="text-primary fw-bold">
                            Register karein
                        </a>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.auth-card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
}
.auth-header {
    text-align: center;
    margin-bottom: 25px;
}
.auth-icon {
    font-size: 3rem;
    margin-bottom: 10px;
}
.auth-header h2 {
    font-weight: 800;
    font-size: 1.5rem;
    color: #1a1a2e;
    margin-bottom: 5px;
}
.auth-header p {
    font-size: 0.9rem;
}

/* Form */
.form-group {
    margin-bottom: 18px;
}
.form-group label {
    font-weight: 700;
    font-size: 0.85rem;
    color: #1a1a2e;
    margin-bottom: 6px;
    display: block;
}
.form-group .form-control {
    padding: 12px 15px;
    border-radius: 10px;
    border: 2px solid #eef0f5;
    font-size: 0.95rem;
    transition: all 0.2s;
}
.form-group .form-control:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    background: white;
    outline: none;
}
.password-input {
    position: relative;
}
.password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    padding: 5px;
    font-size: 1.1rem;
}

/* Button */
.btn-auth {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.3s;
}
.btn-auth:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}
.btn-auth:active {
    transform: translateY(0);
}

/* Footer */
.auth-footer {
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #eef0f5;
    color: #6b7280;
    font-size: 0.9rem;
}

/* Mobile */
@media (max-width: 576px) {
    .auth-card {
        padding: 20px;
    }
    .auth-header h2 {
        font-size: 1.3rem;
    }
}
</style>

<script>
// Toggle Password Visibility
function togglePassword(id) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
    } else {
        input.type = 'password';
    }
}

// Auto-focus on phone input
document.addEventListener('DOMContentLoaded', function() {
    const phoneInput = document.querySelector('input[name="phone"]');
    if (phoneInput) {
        phoneInput.focus();
    }
});
</script>

{% endblock %}
