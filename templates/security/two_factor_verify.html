{% extends 'base.html' %}

{% block title %}Verify Code{% endblock %}

{% block extra_css %}
{{ block.super }}
<style>
    .otp-input { letter-spacing: .5em; font-variant-numeric: tabular-nums; }
</style>
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body p-4">
                    <h1 class="h4 mb-1">Enter verification code</h1>
                    <p class="text-muted mb-4">Type the 6-digit code we sent to your email. It expires in 5 minutes.</p>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label for="otp_code" class="form-label">Verification code</label>
                            <input type="text" id="otp_code" name="otp_code" class="form-control form-control-lg text-center otp-input"
                                   inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"
                                   placeholder="000000" autofocus required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Verify</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
