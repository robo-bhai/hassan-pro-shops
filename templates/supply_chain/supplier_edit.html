{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Supplier{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h5><i class="bi bi-pencil text-warning"></i> Edit Supplier</h5>
                    <p class="text-muted small">{{ supplier.supplier_code }}</p>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Supplier Name</label>
                                <input type="text" name="name" class="form-control" value="{{ supplier.name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Supplier Type</label>
                                <select name="supplier_type" class="form-select" required>
                                    {% for key, value in supplier_types %}
                                    <option value="{{ key }}" {% if supplier.supplier_type == key %}selected{% endif %}>{{ value }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contact Person</label>
                                <input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ supplier.email }}" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" name="phone" class="form-control" value="{{ supplier.phone }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Website</label>
                                <input type="url" name="website" class="form-control" value="{{ supplier.website }}">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="2" required>{{ supplier.address }}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Lead Time (days)</label>
                                <input type="number" name="lead_time" class="form-control" value="{{ supplier.lead_time }}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Payment Terms</label>
                                <input type="text" name="payment_terms" class="form-control" value="{{ supplier.payment_terms }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Rating</label>
                                <input type="number" name="rating" class="form-control" value="{{ supplier.rating }}" step="0.1" min="0" max="5">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">On-Time Delivery %</label>
                                <input type="number" name="on_time_delivery_rate" class="form-control" value="{{ supplier.on_time_delivery_rate }}" step="0.1" min="0" max="100">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Quality Score %</label>
                                <input type="number" name="quality_score" class="form-control" value="{{ supplier.quality_score }}" step="0.1" min="0" max="100">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Price Competitiveness %</label>
                                <input type="number" name="price_competitiveness" class="form-control" value="{{ supplier.price_competitiveness }}" step="0.1" min="0" max="100">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="2">{{ supplier.notes }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input type="checkbox" name="is_active" class="form-check-input" {% if supplier.is_active %}checked{% endif %}>
                                <label class="form-check-label">Active</label>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-check-circle"></i> Update Supplier
                            </button>
                            <a href="{% url 'supplier_detail' supplier.id %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
