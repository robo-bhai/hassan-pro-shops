<style>
.po{--po-card:var(--bg-card,#fff);--po-bd:var(--border-color,#e6e9f0);--po-tx:var(--text-primary,#1a1d2e);--po-mut:var(--text-muted,#6b7280);--po-pr:var(--primary,#4f46e5);--po-soft:rgba(127,127,150,.08)}
.po *{box-sizing:border-box}
.po-card{background:var(--po-card);border:1px solid var(--po-bd);border-radius:14px;margin-bottom:16px;overflow:hidden}
.po-card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--po-bd);font-weight:700;font-size:.92rem}
.po-card-b{padding:16px 18px}
.po-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.po-kpi{background:var(--po-card);border:1px solid var(--po-bd);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--po-tx);display:block;transition:.15s}
.po-kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);color:var(--po-tx)}
.po-kpi .v{font-size:1.25rem;font-weight:800;line-height:1.2}
.po-kpi .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--po-mut)}
.po-kpi.warn .v{color:#dc2626}
.po-table{width:100%;border-collapse:collapse;font-size:.85rem}
.po-table th{background:var(--po-soft);color:var(--po-mut);font-size:.68rem;text-transform:uppercase;letter-spacing:.7px;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--po-bd)}
.po-table td{padding:10px 12px;border-bottom:1px solid var(--po-bd);color:var(--po-tx);vertical-align:middle}
.po-table tbody tr:hover{background:var(--po-soft)}
.po-table .r{text-align:right}.po-table .c{text-align:center}
.po-wrap{overflow-x:auto}
.po-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap}
.po-badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{background:rgba(245,158,11,.15);color:#b45309}
.st-confirmed{background:rgba(6,182,212,.15);color:#0e7490}
.st-processing{background:rgba(79,70,229,.15);color:#4338ca}
.st-shipped{background:rgba(139,92,246,.15);color:#6d28d9}
.st-partially_received{background:rgba(249,115,22,.15);color:#c2410c}
.st-received{background:rgba(22,163,74,.15);color:#15803d}
.st-completed{background:rgba(14,165,233,.15);color:#0369a1}
.st-cancelled{background:rgba(220,38,38,.13);color:#b91c1c}
.po-late{background:rgba(220,38,38,.13);color:#b91c1c;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:700;white-space:nowrap}
.po-bar{height:6px;border-radius:3px;background:var(--po-soft);overflow:hidden;min-width:70px}
.po-bar>i{display:block;height:100%;background:#16a34a;border-radius:3px}
.po-muted{color:var(--po-mut)}
.po-inp{width:100%;border:1px solid var(--po-bd);background:var(--po-card);color:var(--po-tx);border-radius:9px;padding:8px 11px;font-size:.88rem}
.po-inp:focus{outline:none;border-color:var(--po-pr);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.po-lbl{display:block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--po-mut);margin:0 0 4px}
.po-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--po-bd);background:var(--po-card);color:var(--po-tx);border-radius:9px;padding:7px 14px;font-size:.82rem;font-weight:600;text-decoration:none;cursor:pointer}
.po-btn:hover{background:var(--po-soft);color:var(--po-tx)}
.po-btn.pri{background:var(--po-pr);border-color:var(--po-pr);color:#fff}
.po-btn.pri:hover{filter:brightness(1.08);color:#fff}
.po-btn.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.po-btn.bad{color:#dc2626;border-color:rgba(220,38,38,.4)}
.po-btn.sm{padding:4px 10px;font-size:.75rem}
.po-sum{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem}
.po-sum.big{border-top:2px solid var(--po-bd);margin-top:6px;padding-top:10px;font-weight:800;font-size:1.05rem}
.po-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.po-box{background:var(--po-soft);border-radius:12px;padding:14px}
.po-box h6{font-size:.66rem;text-transform:uppercase;letter-spacing:1px;color:var(--po-mut);margin:0 0 8px;font-weight:700}
.po-box p{margin:0 0 3px;font-size:.88rem}
</style>
