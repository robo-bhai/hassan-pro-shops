{% extends 'base.html' %}
{% load static %}

{% block title %}Make Payment{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h5><i class="bi bi-plus-circle text-success"></i> Make Loan Payment</h5>
                    <p class="text-muted small">{{ loan.loan_no }} - {{ loan.borrower.name }}</p>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <div class="d-flex justify-content-between">
                            <span>Outstanding Balance:</span>
                            <span class="fw-bold">Rs. {{ loan.outstanding_balance|floatformat:0|intcomma }}</span>
                        </div>
                    </div>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number" name="amount" class="form-control" 
                                   max="{{ loan.outstanding_balance }}" step="0.01" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select name="payment_method" class="form-select">
                                {% for key, value in payment_methods %}
                                <option value="{{ key }}">{{ value }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Reference No</label>
                            <input type="text" name="reference_no" class="form-control">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="2"></textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Make Payment
                            </button>
                            <a href="{% url 'loan_detail' loan.id %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
