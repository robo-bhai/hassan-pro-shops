{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Goal - {{ goal.name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <h5><i class="bi bi-pencil text-warning"></i> Edit Goal</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Goal Name</label>
                                <input type="text" name="name" class="form-control" value="{{ goal.name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Goal Type</label>
                                <select name="goal_type" class="form-select" required>
                                    {% for key, value in goal_types %}
                                    <option value="{{ key }}" {% if goal.goal_type == key %}selected{% endif %}>
                                        {{ value }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category (Optional)</label>
                                <select name="category" class="form-select">
                                    <option value="">Overall Budget</option>
                                    {% for cat in categories %}
                                    <option value="{{ cat.id }}" {% if goal.category.id == cat.id %}selected{% endif %}>
                                        {{ cat.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Target Amount</label>
                                <input type="number" name="target_amount" class="form-control" 
                                       value="{{ goal.target_amount }}" step="0.01" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" name="start_date" class="form-control" 
                                       value="{{ goal.start_date|date:'Y-m-d' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">End Date</label>
                                <input type="date" name="end_date" class="form-control" 
                                       value="{{ goal.end_date|date:'Y-m-d' }}" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3">{{ goal.description }}</textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-check-circle"></i> Update Goal
                            </button>
                            <a href="{% url 'budget_goal_detail' goal.id %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
