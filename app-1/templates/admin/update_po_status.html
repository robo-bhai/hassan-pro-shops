{% extends "admin/base_site.html" %}
{% block content %}
<h1>📝 Update PO Status</h1>
<div style="background:white;padding:20px;border-radius:10px;max-width:500px;margin:20px auto;">
    <h3>Selected POs: {{ orders.count }}</h3>
    <form method="post">
        {% csrf_token %}
        <label style="font-weight:bold;">New Status:</label>
        <select name="status" style="width:100%;padding:10px;border-radius:5px;margin:10px 0;">
            {% for value, label in status_choices %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
            <a href="{% url 'admin:app_purchaseorder_changelist' %}" style="padding:10px 20px;background:#6c757d;color:white;text-decoration:none;border-radius:5px;">Cancel</a>
            <button type="submit" style="padding:10px 20px;background:#28a745;color:white;border:none;border-radius:5px;">✅ Update</button>
        </div>
    </form>
</div>
{% endblock %}
