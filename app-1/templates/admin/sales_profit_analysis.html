<!-- templates/admin/sales_profit_analysis.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Sales & Profit Analysis Report - {{ date }}</title>
    <style>
        table { border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Sales & Profit Analysis Report</h1>
    <p>Generated on: {{ date }}</p>
    <table>
        <thead>
            <tr>
                <th>Metric</th>
                <th>Amount (PKR)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Total Sales</td>
                <td>{{ profit_data.total_sales|floatformat:2 }}</td>
            </tr>
            <tr>
                <td>Total Profit</td>
                <td>{{ profit_data.total_profit|floatformat:2 }}</td>
            </tr>
            <tr>
                <td>Profit Margin (%)</td>
                <td>{{ profit_data.profit_margin|floatformat:2 }}</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
