<!-- templates/admin/saving_report.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Saving Statement - {{ month }}</title>
    <style>
        table { border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid black; padding: 8px; text-align: right; }
        th { background-color: #f2f2f2; }
        .total { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Saving Statement for {{ month }}</h1>
    <table>
        <tr>
            <th>Description</th>
            <th>Amount (PKR)</th>
        </tr>
        
        <tr>
            <td>Total Saving</td>
            <td>{{ savings|floatformat:2 }}</td>
        </tr>
        
    </table>
    <p>Generated on: {{ date }}</p>
</body>
</html>
