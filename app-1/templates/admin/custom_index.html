{% extends "admin/index.html" %}

{% block content %}
<div id="content-main">
    <!-- System Health & Database Backup Buttons -->
    <div style="margin: 20px 0; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
        <a href="{% url 'admin:system-health' %}" style="display: inline-block; padding: 15px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 10px; text-decoration: none; font-size: 18px; font-weight: bold; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); transition: transform 0.2s;">
            🩺 System Health
        </a>
        
        {% if user.is_superuser %}
        <a href="{% url 'admin:database-backup' %}" style="display: inline-block; padding: 15px 30px; background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white; border-radius: 10px; text-decoration: none; font-size: 18px; font-weight: bold; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4); transition: transform 0.2s;">
            💾 Database Backup
        </a>
        {% endif %}
    </div>
    
    <!-- Quick Stats Bar -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0;">
        <div style="background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div style="font-size: 28px; font-weight: bold; color: #007bff;">{{ app_list|length }}</div>
            <div style="font-size: 12px; color: #666;">Apps</div>
        </div>
        <div style="background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div style="font-size: 28px; font-weight: bold; color: #28a745;">{{ request.user.username }}</div>
            <div style="font-size: 12px; color: #666;">Logged In</div>
        </div>
    </div>
    
    {{ block.super }}  <!-- Model list and other main content -->
</div>

<style>
    #content-main a[href*="system-health"]:hover,
    #content-main a[href*="database-backup"]:hover {
        transform: scale(1.03);
    }
</style>
{% endblock %}
